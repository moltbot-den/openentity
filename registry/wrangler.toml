name = "openentity-registry"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
# No route: the site Worker forwards /v1/* through its REGISTRY service binding.

# Secrets (wrangler secret put): REGISTRY_KEY_JWK, CUSTODY_KEY, HASH_SALT, TURNSTILE_SECRET,
# CIO_SITE_ID, CIO_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
[vars]
STAMP_BITS = "20"
REGISTRY_HOST = "openentity.org"
BASE_RPC_URL = "https://mainnet.base.org"
S3_BUCKET = ""
S3_REGION = "us-east-1"

[[d1_databases]]
binding = "DB"
database_name = "openentity-registry"
database_id = "f24dd781-d0c2-41a7-95cd-60c52588891d"

[[kv_namespaces]]
binding = "KV"
id = "04fc64a9acac4853bc94edb36afaa92a"

[[r2_buckets]]
binding = "LOG"
bucket_name = "openentity-log"

[[queues.producers]]
binding = "LOG_QUEUE"
queue = "openentity-log-incorporate"

[[queues.consumers]]
queue = "openentity-log-incorporate"
max_batch_size = 100
max_batch_timeout = 1
max_concurrency = 1

# Per-IP writes per minute (spec 10.4). Daily caps live in D1 rate_events.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["*/10 * * * *"]

# Throwaway preview for scripts/load-adopt.mjs: own resources, no per-minute IP limiter, high daily cap.
# wrangler deploy --env preview; delete its D1, KV, R2 and queue after the run.
[env.preview]
name = "openentity-registry-preview"
workers_dev = true
routes = []
vars = { STAMP_BITS = "20", REGISTRY_HOST = "openentity.org", BASE_RPC_URL = "https://mainnet.base.org", S3_BUCKET = "", S3_REGION = "us-east-1", IP_DAILY_LIMIT = "1000000" }
d1_databases = [{ binding = "DB", database_name = "openentity-registry-preview", database_id = "00000000-0000-0000-0000-000000000000" }]
kv_namespaces = [{ binding = "KV", id = "00000000000000000000000000000000" }]
r2_buckets = [{ binding = "LOG", bucket_name = "openentity-log-preview" }]
queues = { producers = [{ binding = "LOG_QUEUE", queue = "openentity-log-preview" }], consumers = [{ queue = "openentity-log-preview", max_batch_size = 100, max_batch_timeout = 1, max_concurrency = 1 }] }
