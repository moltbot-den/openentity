name: publish
# Trusted publishing (OIDC) for npm and PyPI: no token in the repo. npm: each package's trusted publisher
# points at this repo and this workflow file, with direct publish off, so the job only stages the version
# and it goes live when an owner approves it on npmjs.com with 2FA. PyPI: the trusted publisher for
# `openentity` points at this workflow too, and publishes directly.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to publish
        type: choice
        options: [cli, sdk/ts, sdk/python, integrations/langchain/js, integrations/langchain/python]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    if: inputs.package != 'sdk/python' && inputs.package != 'integrations/langchain/python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
      - run: bash scripts/verify.sh
      # pnpm pack applies publishConfig and rewrites workspace: ranges; npm stage publish does the OIDC exchange.
      - working-directory: ${{ inputs.package }}
        run: pnpm pack --pack-destination "$RUNNER_TEMP" && npm stage publish "$RUNNER_TEMP"/*.tgz --access public

  pypi:
    if: inputs.package == 'sdk/python' || inputs.package == 'integrations/langchain/python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
      - run: bash scripts/verify.sh
      - working-directory: ${{ inputs.package }}
        run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ inputs.package }}/dist
