name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b9ebc7de787d7dd325eabbe7a0baedce
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - name: D1 migrations
        working-directory: registry
        run: npx wrangler d1 execute openentity-registry --remote --file schema.sql
      - name: Deploy registry
        working-directory: registry
        run: npx wrangler deploy
      - name: Deploy site
        working-directory: site
        run: npx wrangler deploy
      - name: Deploy redirects
        working-directory: redirects
        run: npx wrangler deploy
      - name: Post-deploy fetch check
        run: bash scripts/post-deploy-check.sh https://openentity.org
