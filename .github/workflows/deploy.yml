name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::099705791378:role/openentity-github-deploy
          aws-region: us-east-1
      - name: Deploy AWS stack (CloudFront, Lambda, Aurora, S3, cron)
        working-directory: infra
        run: npx cdk deploy OpenEntity --require-approval never
      - name: Apply schema.sql through the Data API
        working-directory: infra
        run: npx tsx scripts/migrate.ts
      # The account service (ADR 0007): staging first; production deploys only after staging answers.
      - name: Deploy the account service to staging
        working-directory: infra
        run: npx cdk deploy OpenEntityAccountStaging --require-approval never
      - name: Apply account/schema.sql to staging
        working-directory: infra
        run: STACK=OpenEntityAccountStaging SCHEMA=account/schema.sql DB_NAME=account npx tsx scripts/migrate.ts
      - name: Staging check
        run: bash scripts/account-check.sh staging.account.openentity.org
      - name: Deploy the account service to production
        working-directory: infra
        run: npx cdk deploy OpenEntityAccount --require-approval never
      - name: Apply account/schema.sql to production
        working-directory: infra
        run: STACK=OpenEntityAccount SCHEMA=account/schema.sql DB_NAME=account npx tsx scripts/migrate.ts
      - name: Production check
        run: bash scripts/account-check.sh account.openentity.org
      - name: Deploy redirects (Cloudflare, free plan)
        working-directory: redirects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b9ebc7de787d7dd325eabbe7a0baedce
        run: npx wrangler deploy
      - name: Post-deploy fetch check
        run: bash scripts/post-deploy-check.sh https://openentity.org
