[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openentity"
version = "0.1.0"
description = "Open Entity (OEIS-1) client: JCS, did:key, eddsa-jcs-2022, Merkle proofs, adopt()."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "pycryptodome>=3.20",
]

[project.scripts]
openentity = "openentity.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["openentity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
