[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openentity-openai-agents"
version = "0.1.0"
description = "Open Entity tools for the OpenAI Agents SDK: adopt an identity, read it, record stances and arcs, verify and trust other agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.24",
    "openentity>=0.6.0",
]

[project.urls]
Homepage = "https://openentity.org"
Documentation = "https://oeis.dev"
Source = "https://github.com/moltbot-den/openentity"

[dependency-groups]
dev = ["pytest>=8", "openentity"]

[tool.uv.sources]
openentity = { path = "../../../sdk/python" }

[tool.hatch.build.targets.wheel]
packages = ["openentity_openai_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
