    PasskeyOptionsResponse:
      type: object
      required: [challenge_id, options]
      properties:
        challenge_id: { $ref: '#/components/schemas/OpaqueId' }
        options:
          type: object
          description: PublicKeyCredentialRequestOptionsJSON (authenticate) or PublicKeyCredentialCreationOptionsJSON (register), WebAuthn Level 3 JSON form, binary fields base64url.
    PasskeyVerifyRequest:
      type: object
      required: [challenge_id, response, client]
      properties:
        challenge_id: { $ref: '#/components/schemas/OpaqueId' }
        response:
          type: object
          description: AuthenticationResponseJSON or RegistrationResponseJSON (WebAuthn Level 3 toJSON form), binary fields base64url.
        client: { $ref: '#/components/schemas/ClientInfo' }
        attestation: { $ref: '#/components/schemas/Attestation' }
    PasskeyRegistered:
      type: object
      required: [method_id, credential]
      properties:
        method_id: { $ref: '#/components/schemas/OpaqueId' }
        credential: { $ref: '#/components/schemas/Credential', description: The root passkey Credential (type webauthn) for the genesis entry. }
    EmailStartRequest:
      type: object
      required: [email, client]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        client: { $ref: '#/components/schemas/ClientInfo' }
        turnstile_token: { type: string, maxLength: 2048, description: Web only. }
    EmailStartResponse:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id: { $ref: '#/components/schemas/OpaqueId' }
        expires_at: { $ref: '#/components/schemas/UnixSeconds' }
    EmailVerifyRequest:
      type: object
      required: [challenge_id, code, client]
      properties:
        challenge_id: { $ref: '#/components/schemas/OpaqueId' }
        code: { type: string, pattern: '^[0-9]{8}$' }
        client: { $ref: '#/components/schemas/ClientInfo' }
        attestation: { $ref: '#/components/schemas/Attestation' }
        turnstile_token: { type: string, maxLength: 2048, description: Web only; needed only when the start call carried no valid token. }
    Session:
      type: object
      required: [account, new_account, token_type, access_token, access_expires_at, refresh_expires_at]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        new_account: { type: boolean }
        token_type: { type: string, const: Bearer }
        access_token: { $ref: '#/components/schemas/CompactJws', description: Its aud is the service DID. }
        access_expires_at: { $ref: '#/components/schemas/UnixSeconds' }
        refresh_token: { type: string, maxLength: 128, description: 'Apps only (the web gets the session cookie). Opaque; 256 random bits; the service stores only its SHA-256.' }
        refresh_expires_at: { $ref: '#/components/schemas/UnixSeconds' }
    Account:
      type: object
      required: [id, owner_did, email, email_private, created_at, has_key_log, backup_needed, app_account_token, methods, deletion]
      properties:
        id: { type: string, pattern: '^acct_[A-Za-z0-9]{26}$' }
        owner_did:
          anyOf:
            - $ref: '#/components/schemas/OwnerDid'
            - type: 'null'
        email: { type: [string, 'null'], format: email }
        email_private: { type: boolean, description: An Apple private relay address. }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        has_key_log: { type: boolean }
        backup_needed: { type: boolean, description: 'True until the key log holds a second passkey or a second approver device; the app shows "Add a backup".' }
        app_account_token: { type: string, format: uuid, description: The StoreKit appAccountToken and Play obfuscatedAccountId for this account. }
        methods:
          type: array
          items: { $ref: '#/components/schemas/Method' }
        deletion:
          anyOf:
            - $ref: '#/components/schemas/DeletionRequest'
            - type: 'null'
    Method:
      type: object
      required: [id, type, label, created_at, last_used_at]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        type: { $ref: '#/components/schemas/MethodType' }
        label: { type: string, maxLength: 120 }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        last_used_at: { type: [integer, 'null'], minimum: 0 }
    MethodList:
      type: object
      required: [methods]
      properties:
        methods:
          type: array
          items: { $ref: '#/components/schemas/Method' }
    DeletionRequest:
      type: object
      required: [id, requested_at, effective_at, state]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        requested_at: { $ref: '#/components/schemas/UnixSeconds' }
        effective_at: { $ref: '#/components/schemas/UnixSeconds', description: requested_at + 7 days. }
        state: { type: string, enum: [pending, cancelled, done] }
    TokenRequest:
      type: object
      required: [grant_type, audience]
      properties:
        grant_type: { type: string, enum: [refresh_token, login_code, 'urn:openentity:login_code'] }
        refresh_token: { type: string, maxLength: 128, description: refresh_token grant from an app. The web omits it and sends the cookie. }
        login_code: { type: string, maxLength: 128 }
        audience:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/AudienceDid' }
        client: { $ref: '#/components/schemas/ClientInfo' }
        attestation: { $ref: '#/components/schemas/Attestation' }
      allOf:
        - if:
            properties:
              grant_type: { enum: [login_code, 'urn:openentity:login_code'] }
          then:
            required: [login_code, client]
    TokenResponse:
      type: object
      required: [token_type, refresh_expires_at, tokens]
      properties:
        token_type: { type: string, const: Bearer }
        refresh_token: { type: string, maxLength: 128, description: Apps only. The rotated token; the one sent is now used. }
        refresh_expires_at: { $ref: '#/components/schemas/UnixSeconds' }
        tokens:
          type: array
          items: { $ref: '#/components/schemas/AudienceToken' }
        account: { $ref: '#/components/schemas/Account', description: login_code grant only. }
        new_account: { type: boolean, description: login_code grant only. }
    AudienceToken:
      type: object
      required: [audience, access_token, expires_at]
      properties:
        audience: { $ref: '#/components/schemas/AudienceDid' }
        access_token: { $ref: '#/components/schemas/CompactJws' }
        expires_at: { $ref: '#/components/schemas/UnixSeconds' }
    AccessTokenClaims:
      type: object
      description: |
        Claims of an access token: a compact JWS with header {"alg": "ES256", "kid": "<RFC 7638 thumbprint>", "typ":
        "at+jwt"}, signed by the KMS token key. Product checks: typ at+jwt; alg ES256 only; iss equals the environment
        issuer; aud equals the product's own DID (else 401); exp; keys from /.well-known/jwks.json, cached 10 minutes
        and refetched once on an unknown kid. A token presented to the wrong product gets 401.
      required: [iss, sub, aud, iat, exp, jti, sid, client_id, auth_time, amr]
      properties:
        iss: { type: string, enum: ['https://account.openentity.org', 'https://staging.account.openentity.org'] }
        sub: { type: string, description: 'The owner DID. For the service''s own audience before key log genesis, the account id.' }
        aud: { $ref: '#/components/schemas/AudienceDid', description: 'One string, never an array.' }
        iat: { $ref: '#/components/schemas/UnixSeconds' }
        exp: { $ref: '#/components/schemas/UnixSeconds', description: iat + 900. }
        jti: { $ref: '#/components/schemas/OpaqueId' }
        sid: { $ref: '#/components/schemas/OpaqueId', description: The session id. }
        client_id: { type: string, enum: [org.openentity.app, web] }
        auth_time: { $ref: '#/components/schemas/UnixSeconds' }
        amr:
          type: array
          items: { $ref: '#/components/schemas/MethodType' }
    RevokeRequest:
      type: object
      properties:
        refresh_token: { type: string, maxLength: 128 }
    SessionInfo:
      type: object
      required: [id, platform, created_at, last_used_at, current]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        platform: { $ref: '#/components/schemas/Platform' }
        device_model: { type: [string, 'null'], maxLength: 64 }
        app_version: { type: [string, 'null'], maxLength: 32 }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        last_used_at: { $ref: '#/components/schemas/UnixSeconds' }
        current: { type: boolean }
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionInfo' }
    StepUpRequest:
      type: object
      required: [action, params]
      properties:
        action: { type: string, enum: [agent.resume, agent.permissions.widen, method.add, method.remove, email.change, account.delete, deletion.cancel, product.link] }
        params: { type: object, description: Per action; see POST /v1/step-up. }
    ApprovalRequest:
      type: object
      required: [verifier_did, owner_did, request_id, action, payload, payload_digest, expires_at, decisions]
      properties:
        verifier_did: { $ref: '#/components/schemas/Did' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        request_id: { $ref: '#/components/schemas/RequestId' }
        action: { type: string, description: 'A step-up action, pairing.confirm, or agent.approval.' }
        payload: { type: object, description: What the owner is shown. }
        payload_digest: { $ref: '#/components/schemas/Hex64', description: Lowercase hex SHA-256 of the RFC 8785 JCS of payload. }
        expires_at: { $ref: '#/components/schemas/UnixSeconds', description: At most now + 600. }
        decisions:
          type: array
          minItems: 1
          items: { type: string, enum: [approve, deny] }
    Approval2:
      type: object
      description: |
        approval/2.0 (ADR 0008). Normative: test-vectors/approval-2.0/README.md (SDK lane), including the verifier
        checks in order and their error names (malformed, bad_version, wrong_verifier, wrong_owner, owner_closed,
        wrong_request, wrong_payload, bad_decision, expired, expiry_too_far, unknown_key, bad_signature, bad_webauthn,
        counter_replayed). digest = SHA-256(UTF-8("approval/2.0|" verifier_did "|" owner_did "|" request_id "|"
        payload_digest "|" decision "|" expires_at)), expires_at in decimal ASCII. Form p256: `signature` is the raw
        64-byte r||s of ECDSA P-256 over the 32-byte digest with no further hashing (CryptoKit signs the UTF-8 preimage
        with SHA-256, which gives exactly that). Form webauthn: the assertion challenge is base64url(digest), the RP ID
        is the environment RP ID, the accepted origins are https://<environment host> and the OpenEntity Android app's
        android:apk-key-hash:<base64url SHA-256 of the signing certificate> origin, and `signature` is strict DER over
        authenticatorData followed by SHA-256(clientDataJSON). Approvals accept a high or a low s; key log entries
        accept only a low s (KeyLogAuth). All binary fields are strict base64url without padding.
      required: [version, verifier_did, owner_did, request_id, payload_digest, decision, expires_at, device_id, form, signature]
      properties:
        version: { type: string, const: approval/2.0 }
        verifier_did: { $ref: '#/components/schemas/Did' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        request_id: { $ref: '#/components/schemas/RequestId' }
        payload_digest: { $ref: '#/components/schemas/Hex64' }
        decision: { type: string, enum: [approve, deny] }
        expires_at: { type: integer, minimum: 0, maximum: 9007199254740991 }
        device_id: { $ref: '#/components/schemas/Thumbprint', description: The kid of the signing key in the owner key log. }
        form: { type: string, enum: [p256, webauthn] }
        signature: { $ref: '#/components/schemas/Base64url' }
        authenticator_data: { $ref: '#/components/schemas/Base64url' }
        client_data_json: { $ref: '#/components/schemas/Base64url' }
      allOf:
        - if:
            properties:
              form: { const: webauthn }
          then:
            required: [authenticator_data, client_data_json]
    KeyLogEntry:
      type: object
      description: |
        One owner key log entry (ADR 0007). Normative: test-vectors/keylog-1/README.md (SDK lane), including the
        verifier checks in order and their error names; this schema is the wire shape.

        Encoding: an entry travels as its exact RFC 8785 (JCS) line (KeyLogLine), byte for byte, never re-encoded; a
        verifier rejects a line that is not exactly the JCS form of what it parses to. Every number is an integer
        between -(2^53 - 1) and 2^53 - 1; strings carry no lone surrogates; objects have no duplicate keys. `prev` is
        the lowercase hex SHA-256 of the previous line's UTF-8 bytes (`auth` included), null at genesis. The signed
        digest is SHA-256 of the JCS form of the entry without `auth`. Owner id = lowercase RFC 4648 base32, no padding,
        of SHA-256(genesis line): 52 characters. The owner DID is did:web:<RP ID>:o:<id>, with the environment's RP ID
        (account.openentity.org or staging.account.openentity.org).

        Who signs: genesis, the first approver (the root passkey when `approver` is null); add_approver, a current
        approver; recover, the root passkey; replace_root, the root passkey or a current approver; cancel of a recover,
        a current approver, an approver revoked less than 604800 seconds before, or the root passkey; cancel of a
        replace_root, a current approver or an approver revoked less than 604800 seconds before; revoke, a current
        approver or the root passkey; close, an account service close key (did.json).

        Semantics:
        - Every delay runs from the verifier's own first_seen_at, never from `ts`: recover and replace_root take
          effect at first_seen_at + 86400 unless cancelled first (replace_root at once in a single-credential log).
        - Single-credential (root-only) means the genesis `approver` was null and no approver has taken effect since:
          the root passkey is then the approver. Revoking every approver never makes the root an approver again.
        - A recover that takes effect replaces the approver set; the replaced approvers count as revoked from that
          moment (they may sign cancel for 7 days and are notified).
        - A kid enters a log once, even after it is revoked or its entry is cancelled.
        - A pending recover or replace_root stays valid if its signer is revoked later. A cancel whose target already
          took effect, or was already cancelled, is accepted as a no-op.
        - For approver and root changes (add_approver, recover, replace_root, revoke, cancel), the signed entry IS the
          step-up: no separate Approval2.
        - No entry is accepted after close.
      required: [v, seq, prev, op, ts, body, auth]
      additionalProperties: false
      properties:
        v: { type: integer, const: 1 }
        seq: { type: integer, minimum: 1, maximum: 9007199254740991, description: '1 for genesis, then the previous seq plus 1.' }
        prev:
          anyOf:
            - $ref: '#/components/schemas/Hex64'
            - type: 'null'
        op: { type: string, enum: [genesis, add_approver, recover, replace_root, cancel, revoke, close] }
        ts: { type: integer, minimum: 0, maximum: 9007199254740991, description: 'Unix seconds the signer claims. Informational: no delay or window runs from it.' }
        body: { type: object }
        auth: { $ref: '#/components/schemas/KeyLogAuth' }
      allOf:
        - if: { properties: { op: { const: genesis } } }
          then: { properties: { seq: { const: 1 }, prev: { type: 'null' }, body: { $ref: '#/components/schemas/GenesisBody' } } }
        - if: { properties: { op: { const: add_approver } } }
          then: { properties: { body: { $ref: '#/components/schemas/AddApproverBody' } } }
        - if: { properties: { op: { const: recover } } }
          then: { properties: { body: { $ref: '#/components/schemas/RecoverBody' } } }
        - if: { properties: { op: { const: replace_root } } }
          then: { properties: { body: { $ref: '#/components/schemas/ReplaceRootBody' } } }
        - if: { properties: { op: { const: cancel } } }
          then: { properties: { body: { $ref: '#/components/schemas/CancelBody' } } }
        - if: { properties: { op: { const: revoke } } }
          then: { properties: { body: { $ref: '#/components/schemas/RevokeBody' } } }
        - if: { properties: { op: { const: close } } }
          then: { properties: { body: { $ref: '#/components/schemas/CloseBody' } } }
    KeyLogAuth:
      type: object
      description: |
        The one signature that authorizes an entry, over the entry digest. p256: `signature` is the 64-byte raw r||s
        of ECDSA P-256 over the digest with no further hashing (CryptoKit and the Android Keystore sign the JCS bytes
        with SHA-256, which gives the same value). webauthn: a WebAuthn get() assertion whose challenge is
        base64url(digest), checked as approval/2.0 checks one; `signature` is DER over authenticatorData followed by
        SHA-256(clientDataJSON). Signatures in entries are canonical: low s only (s <= n/2 for the P-256 order n; a
        signer whose platform returns a high s sends n - s), strict DER (short-form lengths, minimal positive
        INTEGERs, nothing after the sequence), strict base64url (no padding, no non-zero trailing bits). The form must
        match the key's type. close is signed in the p256 form by an account service close key, kid = its RFC 7638
        thumbprint; verifiers pass the P-256 close keys of the service did.json (current and retired) as serviceKeys.
      required: [kid, form, signature]
      additionalProperties: false
      properties:
        kid: { $ref: '#/components/schemas/Thumbprint' }
        form: { type: string, enum: [p256, webauthn] }
        signature: { $ref: '#/components/schemas/Base64url' }
        authenticator_data: { $ref: '#/components/schemas/Base64url' }
        client_data_json: { $ref: '#/components/schemas/Base64url' }
      allOf:
        - if: { properties: { form: { const: webauthn } } }
          then:
            required: [authenticator_data, client_data_json]
          else:
            not:
              anyOf:
                - required: [authenticator_data]
                - required: [client_data_json]
    KeyLogLine:
      type: string
      maxLength: 65536
      contentMediaType: application/json
      contentSchema: { $ref: '#/components/schemas/KeyLogEntry' }
      description: One entry as its exact RFC 8785 (JCS) line, UTF-8, no trailing newline. Hashes and signatures cover these bytes.
    KeyLogLines:
      type: string
      description: The log as JSON Lines, one KeyLogLine per line, LF separated, lowest seq first.
    KeyLogAppendRequest:
      type: object
      required: [line]
      additionalProperties: false
      properties:
        line:
          type: string
          maxLength: 65536
          contentMediaType: application/json
          contentSchema: { $ref: '#/components/schemas/KeyLogEntry' }
          description: The entry as its exact JCS line.
    Credential:
      type: object
      description: |
        A key in an owner key log: a device P-256 key (type p256: Secure Enclave, StrongBox or TEE) or a passkey (type
        webauthn). The root is always webauthn. `kid` is the RFC 7638 thumbprint of `jwk`: base64url of
        SHA-256(`{"crv":"P-256","kty":"EC","x":"<x>","y":"<y>"}`); the app shows it as the key fingerprint. A webauthn
        credential has a non-empty `credential_id` and `rp_id` equal to the environment RP ID. label, platform,
        key_storage, attestation, integrity and aaguid are signed with the entry and shown to people, but no verifier
        interprets them; the account service checks App Attest, Android Key Attestation and Play Integrity at
        enrollment and records the result here.
      required: [kid, type, jwk]
      properties:
        kid: { $ref: '#/components/schemas/Thumbprint' }
        type: { type: string, enum: [p256, webauthn] }
        jwk: { $ref: '#/components/schemas/PublicKeyJwk' }
        label: { type: string, maxLength: 80 }
        platform: { type: string, enum: [ios, android, web] }
        key_storage: { type: string, enum: [secure_enclave, strongbox, tee] }
        attestation: { $ref: '#/components/schemas/CredentialAttestation' }
        integrity: { $ref: '#/components/schemas/CredentialIntegrity' }
        aaguid: { type: string, format: uuid }
        credential_id: { $ref: '#/components/schemas/Base64url', minLength: 1, description: webauthn only. }
        rp_id: { type: string, description: webauthn only. The environment RP ID. }
      allOf:
        - if: { properties: { type: { const: webauthn } } }
          then: { required: [credential_id, rp_id] }
    PublicKeyJwk:
      type: object
      description: Exactly kty, crv, x and y; x and y are the 32-byte coordinates in strict base64url, and the point is on P-256.
      required: [kty, crv, x, y]
      additionalProperties: false
      properties:
        kty: { type: string, const: EC }
        crv: { type: string, const: P-256 }
        x: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        y: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    CredentialAttestation:
      type: object
      required: [type, verified]
      properties:
        type: { type: string, enum: [app_attest, android_key, webauthn, none] }
        verified: { type: boolean, description: True only when the chain validated to a trusted root. }
        receipt: { $ref: '#/components/schemas/CompactJws', description: 'Device keys: the KeyAttestationReceipt from POST /v1/keylog/attestations, verifiable against the service did.json.' }
    EnrollmentRequest:
      type: object
      required: [purpose, credential]
      additionalProperties: false
      properties:
        purpose: { type: string, enum: [approver, root], description: 'approver: Add an approver or Add a backup; root: Replace root (credential type webauthn).' }
        credential: { $ref: '#/components/schemas/Credential', description: 'The credential exactly as it will appear in the entry body. p256 needs attestation.receipt.' }
    Enrollment:
      type: object
      required: [enrollment_id, purpose, code, credential, state, created_at, expires_at]
      properties:
        enrollment_id: { $ref: '#/components/schemas/OpaqueId' }
        purpose: { type: string, enum: [approver, root] }
        code: { type: string, pattern: '^[0-9]{6}$', description: Shown on the new device and on the approver; the owner confirms that they match before signing. }
        credential: { $ref: '#/components/schemas/Credential' }
        state:
          type: string
          enum: [pending, completed, waiting, expired, cancelled]
          description: |
            pending: no entry yet. waiting: a recover or replace_root carrying the credential was appended and takes
            effect at `effective_at` unless cancelled. completed: the credential is in effect in the log. expired: nothing
            was appended within 10 minutes. cancelled: withdrawn, or the waiting entry was cancelled.
        seq: { type: [integer, 'null'], description: The seq of the entry that carries the credential. }
        effective_at: { type: [integer, 'null'], description: 'When it takes effect, by the service''s first_seen_at; null while pending.' }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        expires_at: { $ref: '#/components/schemas/UnixSeconds', description: created_at + 600; applies only while pending. }
    EnrollmentList:
      type: object
      required: [enrollments]
      properties:
        enrollments:
          type: array
          items: { $ref: '#/components/schemas/Enrollment' }
    KeyAttestationRequest:
      type: object
      required: [nonce, platform, jwk]
      properties:
        nonce: { $ref: '#/components/schemas/RawNonce', description: From POST /v1/auth/nonce; single use. }
        platform: { type: string, enum: [ios, android] }
        jwk: { $ref: '#/components/schemas/PublicKeyJwk', description: The approver key being enrolled. }
        app_attest:
          type: object
          description: iOS. clientDataHash = SHA-256(UTF-8(nonce + "|" + kid)).
          required: [key_id, attestation_object]
          properties:
            key_id: { type: string, maxLength: 128, description: The App Attest key id (base64). }
            attestation_object: { $ref: '#/components/schemas/Base64url' }
        android:
          type: object
          description: Android. The approver key's own Key Attestation chain and a Play Integrity token bound to its kid.
          required: [certificate_chain, integrity_token]
          properties:
            certificate_chain: { type: array, minItems: 2, maxItems: 10, items: { type: string, contentEncoding: base64 }, description: DER certificates, leaf first; attestationChallenge = UTF-8(nonce). }
            integrity_token: { type: string, maxLength: 8192, description: Standard request with requestHash = kid. }
      allOf:
        - if: { properties: { platform: { const: ios } } }
          then: { required: [app_attest] }
        - if: { properties: { platform: { const: android } } }
          then: { required: [android] }
    KeyAttestationResponse:
      type: object
      required: [receipt, claims]
      properties:
        receipt: { $ref: '#/components/schemas/CompactJws', description: The KeyAttestationReceipt. Put it in Credential.attestation.receipt. }
        claims: { $ref: '#/components/schemas/KeyAttestationReceipt' }
    KeyAttestationReceipt:
      type: object
      description: |
        The claims of an attestation receipt: a compact JWS with header {"alg": "EdDSA", "kid": "<service DID>#<RFC 7638
        thumbprint>", "typ": "oe-key-attestation+jwt"}, signed by the account service's Ed25519 key (accountSignature,
        /.well-known/did.json). A verifier checks typ, that the kid's DID is the pinned service DID, the signature,
        and that `kid` equals the credential's kid. Field names follow test-vectors/keylog-1: key_storage, the
        attestation type and verified flag, and integrity {device, strong}.
      required: [iss, kid, platform, type, key_storage, verified, iat]
      properties:
        iss: { $ref: '#/components/schemas/ServiceDid' }
        kid: { $ref: '#/components/schemas/Thumbprint', description: The attested key's RFC 7638 thumbprint. }
        platform: { type: string, enum: [ios, android] }
        type: { type: string, enum: [app_attest, android_key] }
        key_storage: { type: string, enum: [secure_enclave, strongbox, tee] }
        verified: { type: boolean, const: true, description: A receipt is issued only for an attestation that verified. }
        integrity:
          anyOf:
            - $ref: '#/components/schemas/CredentialIntegrity'
            - type: 'null'
          description: Android only; null on iOS.
        iat: { $ref: '#/components/schemas/UnixSeconds' }
    CredentialIntegrity:
      type: object
      description: Android. The Play Integrity verdict at enrollment.
      required: [device, strong]
      properties:
        device: { type: boolean, description: MEETS_DEVICE_INTEGRITY. }
        strong: { type: boolean, description: MEETS_STRONG_INTEGRITY. }
    GenesisBody:
      type: object
      required: [root, approver]
      additionalProperties: false
      properties:
        root: { $ref: '#/components/schemas/Credential', description: The root passkey (type webauthn). }
        approver:
          description: The first approver, or null for a single-credential log.
          anyOf:
            - $ref: '#/components/schemas/Credential'
            - type: 'null'
    AddApproverBody:
      type: object
      required: [approver]
      additionalProperties: false
      properties:
        approver: { $ref: '#/components/schemas/Credential' }
    RecoverBody:
      type: object
      required: [approvers]
      additionalProperties: false
      properties:
        approvers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Credential' }
    ReplaceRootBody:
      type: object
      required: [root]
      additionalProperties: false
      properties:
        root: { $ref: '#/components/schemas/Credential', description: The new root passkey (type webauthn). }
    CancelBody:
      type: object
      required: [target]
      additionalProperties: false
      properties:
        target: { $ref: '#/components/schemas/Hex64', description: The entry hash (as prev uses it) of a recover or replace_root in this log. }
    RevokeBody:
      type: object
      required: [kid]
      additionalProperties: false
      properties:
        kid: { $ref: '#/components/schemas/Thumbprint', description: The kid of a current approver. }
    CloseBody:
      type: object
      maxProperties: 0
      description: Always the empty object.
    LogAppendResponse:
      type: object
      required: [seq, hash, first_seen_at, effective_at]
      properties:
        seq: { type: integer, minimum: 1 }
        hash: { $ref: '#/components/schemas/Hex64', description: SHA-256 of the line, the value the next entry's prev holds. }
        first_seen_at: { $ref: '#/components/schemas/UnixSeconds' }
        effective_at: { $ref: '#/components/schemas/UnixSeconds' }
    PairSas:
      type: object
      description: |
        The pairing match string, pair-sas/1. Normative: test-vectors/pair-sas-1/ (README.md, words.json and
        vectors.json; SDK lane). h = SHA-256(UTF-8("oe-pair-sas/1|" + CODE + "|" + agent_did)), where CODE is the
        pairing code trimmed and upper-cased before hashing and agent_did is the agent's did:key exactly as it signs.
        indexes = the first four bytes of h; names = words[index] from words.json, each two lowercase words (for
        example "red shell"). The agent prints the names joined by ", "; the app renders the symbols by index and
        shows the names.
      required: [version, indexes, names]
      properties:
        version: { type: string, const: pair-sas/1 }
        indexes:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: integer, minimum: 0, maximum: 255 }
        names:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: string, pattern: '^[a-z]+ [a-z]+$' }
    PairingCode:
      type: string
      pattern: '^OE-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$'
      description: Crockford base32 without I, L, O and U.
    Pairing:
      type: object
      required: [id, code, url, expires_at, state]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        code: { $ref: '#/components/schemas/PairingCode' }
        url: { type: string, format: uri, description: 'https://openentity.org/pair#OE-XXXX-XXXX, shown as a QR code.' }
        expires_at: { $ref: '#/components/schemas/UnixSeconds' }
        state: { type: string, enum: [waiting, claimed, confirmed, expired, cancelled] }
    PairingDetail:
      allOf:
        - $ref: '#/components/schemas/Pairing'
        - type: object
          required: [agent, sas, approval_request]
          properties:
            agent:
              anyOf:
                - $ref: '#/components/schemas/PairingAgent'
                - type: 'null'
            sas:
              anyOf:
                - $ref: '#/components/schemas/PairSas'
                - type: 'null'
            approval_request:
              description: Present while claimed; action pairing.confirm.
              anyOf:
                - $ref: '#/components/schemas/ApprovalRequest'
                - type: 'null'
    PairingAgent:
      type: object
      required: [did, framework, host, sdk, sdk_version, safety]
      properties:
        did: { $ref: '#/components/schemas/AgentDid' }
        framework: { type: string, maxLength: 64 }
        host: { type: [string, 'null'], maxLength: 255 }
        sdk: { type: string, maxLength: 64 }
        sdk_version: { type: string, maxLength: 32 }
        safety:
          anyOf:
            - $ref: '#/components/schemas/SafetyVerdict'
            - type: 'null'
    SafetyVerdict:
      type: object
      description: The latest Secure My Agent verdict on the agent, read from the registry (ADR 0002).
      required: [verdict, checked_at]
      properties:
        verdict: { type: string, maxLength: 32 }
        checked_at: { $ref: '#/components/schemas/UnixSeconds' }
    PairingConfirmRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        label: { type: string, maxLength: 80 }
    Agent:
      type: object
      required: [did, label, framework, host, state, status, permissions, products, paired_at, last_seen_at]
      properties:
        did: { $ref: '#/components/schemas/AgentDid' }
        label: { type: [string, 'null'], maxLength: 80 }
        framework: { type: [string, 'null'], maxLength: 64 }
        host: { type: [string, 'null'], maxLength: 255 }
        state: { type: string, enum: [active, paused] }
        status:
          anyOf:
            - $ref: '#/components/schemas/AgentStatus'
            - type: 'null'
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        products:
          type: array
          items: { $ref: '#/components/schemas/ProductDid' }
        paired_at: { $ref: '#/components/schemas/UnixSeconds' }
        last_seen_at: { type: [integer, 'null'], minimum: 0 }
    AgentStatus:
      type: object
      required: [state, summary, at]
      properties:
        state: { type: string, enum: [running, idle, blocked, error, done] }
        summary: { type: string, maxLength: 200 }
        progress: { type: [number, 'null'], minimum: 0, maximum: 1 }
        at: { $ref: '#/components/schemas/UnixSeconds' }
    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
    AgentPatch:
      type: object
      minProperties: 1
      properties:
        label: { type: string, maxLength: 80 }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    PauseRequest:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [app, control, siri, tile, widget, web] }
    PauseAllResponse:
      type: object
      required: [paused]
      properties:
        paused: { type: integer, minimum: 0 }
    CommandRequest:
      type: object
      required: [command]
      properties:
        command: { type: string, enum: [checkup, fix] }
        args: { type: object }
    IdResponse:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
    Attachment:
      type: object
      required: [id, name, content_type, size]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string, maxLength: 255 }
        content_type: { type: string, maxLength: 127 }
        size: { type: integer, minimum: 0, maximum: 10485760 }
    Message:
      type: object
      required: [id, from, text, attachments, created_at]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        from: { type: string, enum: [owner, agent] }
        text: { type: string, maxLength: 4096 }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        acked_at: { type: [integer, 'null'], minimum: 0, description: Owner messages only; when the agent acknowledged it. }
    MessageList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
    OwnerMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4096, description: At most 4096 UTF-8 bytes. }
    AgentApproval:
      type: object
      required: [id, request_id, state, title, summary, risk, created_at, expires_at, decided_at]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        request_id: { $ref: '#/components/schemas/RequestId' }
        state: { type: string, enum: [pending, approved, denied, expired] }
        title: { type: string, maxLength: 120 }
        summary: { type: string, maxLength: 2000 }
        details: { type: object }
        risk: { type: string, enum: [low, medium, high] }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        expires_at: { $ref: '#/components/schemas/UnixSeconds' }
        decided_at: { type: [integer, 'null'], minimum: 0 }
        approval: { $ref: '#/components/schemas/Approval2', description: Once decided. }
        agent_did: { $ref: '#/components/schemas/AgentDid', description: Owner view only. }
        approval_request: { $ref: '#/components/schemas/ApprovalRequest', description: 'Owner view only, while pending; action agent.approval, verifier the service DID.' }
    AgentApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items: { $ref: '#/components/schemas/AgentApproval' }
    AgentApprovalCreate:
      type: object
      required: [title, summary, risk, expires_in]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string, minLength: 1, maxLength: 2000 }
        details: { type: object }
        risk: { type: string, enum: [low, medium, high] }
        expires_in: { type: integer, minimum: 60, maximum: 600 }
    Purchase:
      oneOf:
        - $ref: '#/components/schemas/IosPurchase'
        - $ref: '#/components/schemas/AndroidPurchase'
      discriminator:
        propertyName: platform
        mapping:
          ios: '#/components/schemas/IosPurchase'
          android: '#/components/schemas/AndroidPurchase'
    IosPurchase:
      type: object
      required: [platform, signed_transaction]
      properties:
        platform: { type: string, const: ios }
        signed_transaction: { $ref: '#/components/schemas/CompactJws', description: The StoreKit 2 jwsRepresentation. }
    AndroidPurchase:
      type: object
      required: [platform, product_id, purchase_token]
      properties:
        platform: { type: string, const: android }
        product_id: { type: string, maxLength: 128 }
        purchase_token: { type: string, maxLength: 4096 }
    Entitlement:
      type: object
      required: [product, plan, status, source, period_end]
      properties:
        product: { $ref: '#/components/schemas/ProductDid' }
        plan: { type: string, maxLength: 64 }
        status: { type: string, enum: [active, grace, expired, revoked, refunded] }
        source: { type: string, enum: [iap, play] }
        period_end: { type: [integer, 'null'], minimum: 0 }
    EntitlementList:
      type: object
      required: [entitlements]
      properties:
        entitlements:
          type: array
          items: { $ref: '#/components/schemas/Entitlement' }
    AppStoreNotification:
      type: object
      required: [signedPayload]
      properties:
        signedPayload: { $ref: '#/components/schemas/CompactJws' }
    PubSubPush:
      type: object
      required: [message, subscription]
      properties:
        message:
          type: object
          required: [data, messageId, publishTime]
          properties:
            data: { type: string, contentEncoding: base64, description: The base64 JSON DeveloperNotification. }
            messageId: { type: string }
            publishTime: { type: string, format: date-time }
            attributes:
              type: object
              additionalProperties: { type: string }
        subscription: { type: string }
    PairRequest:
      type: object
      required: [code, presentation, framework, sdk, sdk_version]
      properties:
        code: { $ref: '#/components/schemas/PairingCode' }
        presentation: { type: object, description: 'An OEIS-1 Presentation (buildPresentation): eid = the signer, audience = the service DID, nonce = "pair:" + the code as shown (pair:OE-XXXX-XXXX).' }
        framework: { type: string, maxLength: 64, description: 'e.g. openclaw, claude-code, openai-agents, langchain, crewai.' }
        sdk: { type: string, maxLength: 64 }
        sdk_version: { type: string, maxLength: 32 }
        host: { type: string, maxLength: 255 }
    PairClaim:
      type: object
      required: [pairing_id, sas, expires_at, poll_interval]
      properties:
        pairing_id: { $ref: '#/components/schemas/OpaqueId' }
        sas: { $ref: '#/components/schemas/PairSas' }
        expires_at: { $ref: '#/components/schemas/UnixSeconds' }
        poll_interval: { type: integer, const: 2, description: 'Seconds between GET /v1/pair/{pairing_id} calls.' }
    PairStatus:
      type: object
      required: [state, owner_did, permissions]
      properties:
        state: { type: string, enum: [claimed, confirmed, rejected, expired] }
        owner_did:
          description: Null until confirmed.
          anyOf:
            - $ref: '#/components/schemas/OwnerDid'
            - type: 'null'
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        credentials:
          type: array
          description: Once, on the first confirmed read.
          items: { $ref: '#/components/schemas/BearerCredential' }
    BearerCredential:
      type: object
      required: [product, kind, key, expires_at]
      properties:
        product: { $ref: '#/components/schemas/ProductDid' }
        kind: { type: string, const: bearer }
        key: { type: string, maxLength: 512, description: 'The product key (moltbotden_sk_, sma_, ass_ or cgrc_), scoped to the granted permissions.' }
        expires_at: { $ref: '#/components/schemas/UnixSeconds', description: Issued for 30 days. }
    ProductCredentialRenewRequest:
      type: object
      required: [request_id, agent_did, owner_did, kind, permissions]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId', description: Idempotency key; the same value within 1 hour returns the same key. }
        agent_did: { type: string, pattern: '^did:key:z6Mk[1-9A-HJ-NP-Za-km-z]+$' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        kind: { type: string, const: bearer }
        permissions: { type: array, items: { type: string }, description: The agent's current permissions; scope the key to them. }
    ProductCredentialRenewal:
      type: object
      description: A BearerCredential plus when the agent's older keys stop working (issued_at + 3600).
      required: [product, kind, key, expires_at, previous_valid_until]
      properties:
        product: { $ref: '#/components/schemas/ProductDid' }
        kind: { type: string, const: bearer }
        key: { type: string, maxLength: 512, description: The new key (moltbotden_sk_, sma_, ass_ or cgrc_). }
        expires_at: { $ref: '#/components/schemas/UnixSeconds', description: Issued for 30 days. }
        previous_valid_until: { $ref: '#/components/schemas/UnixSeconds', description: The older keys of this agent stay valid until then, 1 hour after this renewal. }
    CredentialList:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items: { $ref: '#/components/schemas/BearerCredential' }
    AgentSelf:
      type: object
      required: [did, owner_did, state, permissions, products]
      properties:
        did: { $ref: '#/components/schemas/AgentDid' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        state: { type: string, enum: [active, paused] }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        products:
          type: array
          items: { $ref: '#/components/schemas/ProductDid' }
    InboxItem:
      oneOf:
        - $ref: '#/components/schemas/WsMessage'
        - $ref: '#/components/schemas/WsCommand'
        - $ref: '#/components/schemas/WsApprovalResult'
        - $ref: '#/components/schemas/WsPermissions'
      discriminator:
        propertyName: type
        mapping:
          message: '#/components/schemas/WsMessage'
          command: '#/components/schemas/WsCommand'
          approval.result: '#/components/schemas/WsApprovalResult'
          permissions: '#/components/schemas/WsPermissions'
    InboxList:
      type: object
      required: [items, more]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/InboxItem' }
        more: { type: boolean }
    AckRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/OpaqueId' }
    AgentMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4096, description: At most 4096 UTF-8 bytes. }
        attachments:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/OpaqueId', description: An upload_id from POST /v1/agent/uploads. }
    UploadRequest:
      type: object
      required: [name, content_type, size]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string, maxLength: 127 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    UploadResponse:
      type: object
      required: [upload_id, url, method, headers, expires_at]
      properties:
        upload_id: { $ref: '#/components/schemas/OpaqueId' }
        url: { type: string, format: uri }
        method: { type: string, const: PUT }
        headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { $ref: '#/components/schemas/UnixSeconds', description: now + 300. }
    StatusRequest:
      type: object
      required: [state, summary]
      properties:
        state: { type: string, enum: [running, idle, blocked, error, done] }
        summary: { type: string, maxLength: 200 }
        progress: { type: number, minimum: 0, maximum: 1 }
    RenewRequest:
      type: object
      properties:
        products:
          type: array
          description: Default every product the agent holds a key for.
          items: { $ref: '#/components/schemas/ProductDid' }
    WsSync:
      type: object
      required: [action]
      properties:
        action: { type: string, const: sync }
    WsAck:
      type: object
      required: [action, ids]
      properties:
        action: { type: string, const: ack }
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/OpaqueId' }
    WsHeartbeat:
      type: object
      required: [action]
      properties:
        action: { type: string, const: heartbeat }
    WsMessage:
      type: object
      required: [type, id, created_at, text, attachments]
      properties:
        type: { type: string, const: message }
        id: { $ref: '#/components/schemas/OpaqueId' }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        text: { type: string, maxLength: 4096 }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
    WsCommand:
      type: object
      required: [type, id, created_at, command, args]
      properties:
        type: { type: string, const: command }
        id: { $ref: '#/components/schemas/OpaqueId' }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        command: { type: string, enum: [checkup, fix, pause, resume] }
        args: { type: object }
    WsApprovalResult:
      type: object
      required: [type, id, created_at, approval_id, state]
      properties:
        type: { type: string, const: approval.result }
        id: { $ref: '#/components/schemas/OpaqueId' }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        approval_id: { $ref: '#/components/schemas/OpaqueId' }
        state: { type: string, enum: [approved, denied, expired] }
        approval:
          anyOf:
            - $ref: '#/components/schemas/Approval2'
            - type: 'null'
    WsPermissions:
      type: object
      required: [type, id, created_at, permissions]
      properties:
        type: { type: string, const: permissions }
        id: { $ref: '#/components/schemas/OpaqueId' }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    WsHeartbeatReply:
      type: object
      required: [type]
      properties:
        type: { type: string, const: heartbeat }
    WsError:
      type: object
      required: [type, error, message]
      properties:
        type: { type: string, const: error }
        error: { type: string }
        message: { type: string }
        close_code: { type: integer, enum: [4001, 4003, 4008], description: 'Present on the last frame before the server closes the socket: the close code (x-websocket closeCodes).' }
    NotifyRequest:
      type: object
      required: [owner_did, type, id]
      properties:
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        type: { type: string, enum: [approval.requested, approval.resolved, alert, refresh] }
        id: { type: string, pattern: '^[A-Za-z0-9:._-]{1,128}$', description: The product-scoped id the app fetches from the product. }
        agent_did: { $ref: '#/components/schemas/AgentDid' }
        collapse_key: { type: string, maxLength: 64 }
        ttl: { type: integer, minimum: 1, maximum: 86400 }
    NotifyResponse:
      type: object
      required: [queued]
      properties:
        queued: { type: boolean, const: true }
    PushPayload:
      type: object
      description: |
        The custom data in every APNs and FCM push: ids only. The visible text, if any, is fixed by the service per sender
        and type. `product` is the sender: a product DID for POST /v1/notify, or the service DID for the service's own
        notices (enrollment.pending, enrollment.completed, signin.new, deletion.requested, keylog.revoke, keylog.recover,
        keylog.replace_root, agent.muted). Apps ignore types they do not know. Silent (content-available) types:
        approval.resolved, refresh, enrollment.completed.
      required: [oe]
      properties:
        oe:
          type: object
          required: [product, type, id]
          properties:
            product: { $ref: '#/components/schemas/Did' }
            type: { type: string, maxLength: 64, examples: [approval.requested, approval.resolved, alert, refresh, enrollment.pending, signin.new] }
            id: { type: string }
            agent: { $ref: '#/components/schemas/AgentDid' }
    EventName:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,63}$'
      description: A name listed in account/analytics/events.yaml.
    IngestEvent:
      type: object
      required: [name, time, insert_id, properties]
      properties:
        name: { $ref: '#/components/schemas/EventName' }
        time: { type: integer, minimum: 0, description: Unix milliseconds. }
        insert_id: { type: string, maxLength: 64, description: Deduplicates retries. }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        agent_did: { $ref: '#/components/schemas/AgentDid' }
        properties: { type: object }
    IngestRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/IngestEvent' }
    AppEvent:
      type: object
      required: [name, time, insert_id, properties]
      properties:
        name: { $ref: '#/components/schemas/EventName' }
        time: { type: integer, minimum: 0, description: Unix milliseconds. }
        insert_id: { type: string, maxLength: 64 }
        properties: { type: object }
    AppEventsRequest:
      type: object
      required: [install_id, events]
      properties:
        install_id: { type: string, format: uuid }
        events:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/AppEvent' }
    EventsAccepted:
      type: object
      required: [accepted, rejected]
      properties:
        accepted: { type: integer, minimum: 0 }
        rejected:
          type: array
          items:
            type: object
            required: [index, error]
            properties:
              index: { type: integer, minimum: 0 }
              error: { type: string }
    InstallRequest:
      type: object
      required: [install_id, platform]
      properties:
        install_id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/Platform' }
        app_version: { type: string, maxLength: 32 }
    InstallResponse:
      type: object
      required: [install_token]
      properties:
        install_token: { type: string, maxLength: 256 }
    PausedChange:
      type: object
      required: [agent_did, owner_did, state, at, seq]
      properties:
        agent_did: { $ref: '#/components/schemas/AgentDid' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        state: { type: string, enum: [paused, active] }
        at: { $ref: '#/components/schemas/UnixSeconds' }
        seq: { type: integer, minimum: 1, description: The agent's pause-state counter (shared with agent.paused and agent.resumed). }
    PausedList:
      type: object
      required: [since, cursor, generated_at, changes]
      properties:
        since: { type: [string, 'null'], description: Echoes the request's since; products check it. }
        cursor: { type: string, maxLength: 128, description: Send as since next time. }
        generated_at: { $ref: '#/components/schemas/UnixSeconds' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/PausedChange' }
    ApproveEnvelope:
      type: object
      description: |
        The claims of an approval request envelope: a compact JWS with header {"alg": "EdDSA", "kid": "<DID URL of an
        Ed25519 assertionMethod key of the verifier DID>", "typ": "oe-approval-request+jwt"}, signed by the product.
      required: [iss, aud, iat, exp, request_id, owner_did, payload, payload_digest, return_url]
      properties:
        iss: { $ref: '#/components/schemas/ProductDid', description: The verifier DID. }
        aud: { $ref: '#/components/schemas/ServiceDid' }
        iat: { $ref: '#/components/schemas/UnixSeconds' }
        exp: { $ref: '#/components/schemas/UnixSeconds', description: 'The approval''s expires_at; at most iat + 600.' }
        request_id: { $ref: '#/components/schemas/RequestId' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        payload: { type: object, description: The canonical summary the owner sees. }
        payload_digest: { $ref: '#/components/schemas/Hex64', description: Lowercase hex SHA-256 of the RFC 8785 JCS of payload. }
        return_url: { type: string, format: uri, description: 'https, on the same registrable domain as the verifier DID host (did:web:api.agentsecretstore.com allows https://agentsecretstore.com/... and its subdomains).' }
        state: { type: string, maxLength: 256 }
    OwnerLinkRequest:
      type: object
      required: [product]
      properties:
        product: { $ref: '#/components/schemas/ProductDid' }
    OwnerLink:
      type: object
      required: [product, envelope, link_url, expires_at]
      properties:
        product: { $ref: '#/components/schemas/ProductDid' }
        envelope: { $ref: '#/components/schemas/CompactJws', description: The LinkOwnerEnvelope. }
        link_url: { type: string, format: uri, description: 'The product''s link page, https://<product web host>/oe/link, with "#envelope=<JWS>" appended (a fragment, so it never reaches server logs).' }
        expires_at: { $ref: '#/components/schemas/UnixSeconds' }
    LinkOwnerEnvelope:
      type: object
      description: |
        The claims of an owner-link envelope: a compact JWS with header {"alg": "EdDSA", "kid": "<service DID>#<RFC
        7638 thumbprint>", "typ": "oe-link-owner+jwt"}, signed by the account service's Ed25519 key (the key of
        accountSignature, in /.well-known/did.json under assertionMethod). The same JWS format as ApproveEnvelope,
        signed in the other direction. Issued by POST /v1/account/links after a product.link step-up.

        The product verifies, in order: typ is oe-link-owner+jwt and alg is EdDSA; the kid's DID equals the pinned
        service DID of its environment and the key is in the current did.json (cache at most 10 minutes, refetch once on
        an unknown kid); the signature; purpose is link-owner; aud is its own DID; iat is not in the future (5 seconds of
        skew) and now < exp <= iat + 600; jti was not used before (remember it until exp). Then it stores `sub` as
        `oe_owner_did` on the web user it signed in, and answers 409 if that user is already linked to another owner
        DID. This replaces any interim link format (Agent Secret Store's ES256 `purpose: link-owner` JWT).
      required: [iss, aud, sub, purpose, iat, exp, jti]
      properties:
        iss: { $ref: '#/components/schemas/ServiceDid' }
        aud: { $ref: '#/components/schemas/ProductDid' }
        sub: { $ref: '#/components/schemas/OwnerDid', description: The owner DID to link. }
        purpose: { type: string, const: link-owner }
        iat: { $ref: '#/components/schemas/UnixSeconds' }
        exp: { $ref: '#/components/schemas/UnixSeconds', description: At most iat + 600. }
        jti: { type: string, pattern: '^lnk_[A-Za-z0-9]{26}$', description: Single use. }
    ApproveCheckRequest:
      type: object
      required: [request]
      properties:
        request: { $ref: '#/components/schemas/CompactJws', description: The envelope (ApproveEnvelope). }
    ApproveCheck:
      type: object
      required: [verifier_did, owner_did, request_id, payload, payload_digest, expires_at, return_url, rp_id, allow_credentials]
      properties:
        verifier_did: { $ref: '#/components/schemas/ProductDid' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        request_id: { $ref: '#/components/schemas/RequestId' }
        payload: { type: object }
        payload_digest: { $ref: '#/components/schemas/Hex64' }
        expires_at: { $ref: '#/components/schemas/UnixSeconds' }
        return_url: { type: string, format: uri }
        state: { type: [string, 'null'] }
        rp_id: { type: string }
        allow_credentials:
          type: array
          description: The owner's approver passkey credential ids (the root passkey in a single-credential log).
          items: { $ref: '#/components/schemas/Base64url' }
        kids:
          type: object
          description: The key log kid of each credential in allow_credentials, by credential id. The page puts it in the Approval2 `device_id`.
          additionalProperties: { $ref: '#/components/schemas/Thumbprint' }
        challenges:
          type: object
          description: The WebAuthn challenge for each decision, base64url of the approval/2.0 digest computed by the service (approvalDigest in @openentity/sdk).
          required: [approve, deny]
          properties:
            approve: { $ref: '#/components/schemas/Base64url' }
            deny: { $ref: '#/components/schemas/Base64url' }
    ApproveReturnForm:
      type: object
      description: What the /approve page auto-submits to return_url as application/x-www-form-urlencoded. Either approval or error is present.
      required: [request_id]
      properties:
        approval: { type: string, description: The Approval2 object as JSON text. }
        error: { type: string, const: cancelled }
        request_id: { $ref: '#/components/schemas/RequestId' }
        state: { type: string, maxLength: 256 }
    AccountEvent:
      type: object
      description: |
        The body of POST /v1/oe/events. Types the service sends: agent.paired, agent.paused, agent.resumed,
        agent.unlinked, agent.permissions, owner.deleted (the owner-delete call), plan.changed (the signed plan-grant
        call). Products ignore types they do not know.
      required: [id, type, created_at, data]
      properties:
        id: { type: string, pattern: '^evt_[A-Za-z0-9_-]{1,60}$', description: Dedupe for at least 24 hours. }
        type: { type: string, maxLength: 64 }
        created_at: { $ref: '#/components/schemas/UnixSeconds' }
        data: { type: object }
      allOf:
        - if: { properties: { type: { const: agent.paired } } }
          then: { properties: { data: { $ref: '#/components/schemas/AgentPairedData' } } }
        - if: { properties: { type: { const: agent.paused } } }
          then: { properties: { data: { $ref: '#/components/schemas/AgentPausedData' } } }
        - if: { properties: { type: { const: agent.resumed } } }
          then: { properties: { data: { $ref: '#/components/schemas/AgentResumedData' } } }
        - if: { properties: { type: { const: agent.unlinked } } }
          then: { properties: { data: { $ref: '#/components/schemas/AgentUnlinkedData' } } }
        - if: { properties: { type: { const: agent.permissions } } }
          then: { properties: { data: { $ref: '#/components/schemas/AgentPermissionsData' } } }
        - if: { properties: { type: { const: owner.deleted } } }
          then: { properties: { data: { $ref: '#/components/schemas/OwnerDeletedData' } } }
        - if: { properties: { type: { const: plan.changed } } }
          then: { properties: { data: { $ref: '#/components/schemas/PlanChangedData' } } }
    AgentPairedData:
      type: object
      required: [agent_did, owner_did, permissions, framework, seq]
      properties:
        agent_did: { $ref: '#/components/schemas/AgentDid' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        framework: { type: [string, 'null'], maxLength: 64, description: What the agent named at claim, e.g. openclaw. }
        seq: { type: integer, minimum: 1, description: 'The agent''s permissions counter, as on agent.permissions: apply these permissions only if newer than the ones held.' }
    AgentPausedData:
      type: object
      required: [agent_did, owner_did, paused_at, seq]
      properties:
        agent_did: { $ref: '#/components/schemas/AgentDid' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        paused_at: { $ref: '#/components/schemas/UnixSeconds' }
        seq: { type: integer, minimum: 1, description: The agent's pause-state counter. Apply only if newer than the one held. }
    AgentResumedData:
      type: object
      required: [agent_did, owner_did, resumed_at, seq]
      properties:
        agent_did: { $ref: '#/components/schemas/AgentDid' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        resumed_at: { $ref: '#/components/schemas/UnixSeconds' }
        seq: { type: integer, minimum: 1, description: The agent's pause-state counter. Apply only if newer than the one held. }
    AgentUnlinkedData:
      type: object
      required: [agent_did, owner_did]
      properties:
        agent_did: { $ref: '#/components/schemas/AgentDid' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
    AgentPermissionsData:
      type: object
      required: [agent_did, owner_did, permissions, seq]
      properties:
        agent_did: { $ref: '#/components/schemas/AgentDid' }
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        seq: { type: integer, minimum: 1, description: The agent's permissions counter (separate from the pause-state counter). }
    OwnerDeletedData:
      type: object
      required: [owner_did, deleted_at]
      properties:
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        deleted_at: { $ref: '#/components/schemas/UnixSeconds' }
    PlanChangedData:
      type: object
      required: [owner_did, product, plan, status, source, period_end, store_transaction_id]
      properties:
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        product: { $ref: '#/components/schemas/ProductDid' }
        plan: { type: string, maxLength: 64 }
        status: { type: string, enum: [active, grace, expired, revoked, refunded] }
        source: { type: string, enum: [iap, play] }
        period_end: { type: [integer, 'null'], minimum: 0 }
        store_transaction_id: { type: string, maxLength: 128, description: The original transaction id (App Store) or purchase token (Play). }
    OeKeylogRequest:
      type: object
      required: [owner_did, lines]
      properties:
        owner_did: { $ref: '#/components/schemas/OwnerDid' }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: Consecutive entries, lowest seq first, each as its exact JCS line.
          items:
            type: string
            maxLength: 65536
            contentMediaType: application/json
            contentSchema: { $ref: '#/components/schemas/KeyLogEntry' }
    OeKeylogResponse:
      type: object
      required: [head]
      properties:
        head: { type: integer, minimum: 1, description: The seq of the product's newest entry for this owner. }
    MethodAddRequest:
      type: object
      required: [type, proof]
      properties:
        type: { $ref: '#/components/schemas/MethodType' }
        proof: { type: object, description: A fresh sign-in with the new method, shaped by type. }
      allOf:
        - if: { properties: { type: { const: apple } } }
          then: { properties: { proof: { $ref: '#/components/schemas/AppleProof' } } }
        - if: { properties: { type: { const: google } } }
          then: { properties: { proof: { $ref: '#/components/schemas/GoogleProof' } } }
        - if: { properties: { type: { const: email } } }
          then: { properties: { proof: { $ref: '#/components/schemas/EmailProof' } } }
        - if: { properties: { type: { const: passkey } } }
          then: { properties: { proof: { $ref: '#/components/schemas/PasskeyProof' } } }
    AppleProof:
      type: object
      required: [identity_token, nonce]
      properties:
        identity_token: { $ref: '#/components/schemas/CompactJws' }
        nonce: { $ref: '#/components/schemas/RawNonce' }
    GoogleProof:
      type: object
      required: [id_token, nonce]
      properties:
        id_token: { $ref: '#/components/schemas/CompactJws' }
        nonce: { $ref: '#/components/schemas/RawNonce' }
    EmailProof:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { $ref: '#/components/schemas/OpaqueId' }
        code: { type: string, pattern: '^[0-9]{8}$' }
    PasskeyProof:
      type: object
      required: [challenge_id, response]
      properties:
        challenge_id: { $ref: '#/components/schemas/OpaqueId' }
        response: { type: object, description: RegistrationResponseJSON (WebAuthn Level 3 toJSON form). }
    EmailChangeRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { $ref: '#/components/schemas/OpaqueId', description: From POST /v1/auth/email/start for the new address. }
        code: { type: string, pattern: '^[0-9]{8}$' }
    AccountDeleted:
      type: object
      required: [deleted_at]
      properties:
        deleted_at: { $ref: '#/components/schemas/UnixSeconds' }
    PushTokenRequest:
      type: object
      required: [provider, token]
      properties:
        provider: { type: string, enum: [apns, fcm] }
        token: { type: string, maxLength: 4096 }
        environment: { type: string, enum: [sandbox, production], description: APNs only. }
      allOf:
        - if: { properties: { provider: { const: apns } } }
          then: { required: [environment] }
    PasskeyVerifyResponse:
      description: A Session for mode authenticate; PasskeyRegistered for mode register.
      oneOf:
        - $ref: '#/components/schemas/Session'
        - $ref: '#/components/schemas/PasskeyRegistered'
    ApprovePage:
      type: string
      description: The HTML page.
