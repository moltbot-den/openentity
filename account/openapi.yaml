        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Tokens.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request, invalid_audience'
        '401':
          $ref: '#/components/responses/Error'
          description: 'error: invalid_grant, token_reused, binding_required, binding_invalid'
        '403':
          $ref: '#/components/responses/Error'
          description: 'error: key_log_required, attestation_required, attestation_invalid, bad_origin'
        '429':
          $ref: '#/components/responses/RateLimited'
