  /o/{id}/log:
    get:
      operationId: readKeyLog
      tags: [Key log]
      summary: Read an owner key log
      description: |
        JSON Lines, one exact JCS entry line per line, from seq `from` (default 1; genesis is seq 1). A closed log stays
        readable. X-OE-First-Seen-At carries the account service's own first_seen_at for each returned line: the
        server's view. The app passes it to verifyKeyLog to show when a pending recover or replace_root takes effect.
        Products never use it: they record and run every delay from their own first_seen_at.
      x-available: day-2
      security: []
      parameters:
        - $ref: '#/components/parameters/OwnerIdPath'
        - name: from
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Entries.
          headers:
            X-OE-Log-Head:
              description: The seq of the last entry.
              schema: { type: integer, minimum: 1 }
            X-OE-First-Seen-At:
              description: The account service's first_seen_at (Unix seconds) for each returned line, in the same order, comma-separated with no spaces, for example `1794009600,1794016800`. One value per line of the body.
              schema: { type: string, pattern: '^[0-9]+(,[0-9]+)*$' }
          content:
            application/jsonl:
              schema:
                $ref: '#/components/schemas/KeyLogLines'
        '404':
          $ref: '#/components/responses/Error'
          description: 'error: not_found'
    post:
      operationId: appendKeyLog
      tags: [Key log]
      summary: Append an entry (genesis creates the owner DID)
      description: |
        The body is `{line}`, final: the entry as its exact JCS line. The service stores and serves those bytes and never
        re-encodes them. genesis (seq 1): ownerBearer of an account with no key log, and `{id}` must equal the
        lowercase base32 of SHA-256(line). Other ops are self-authenticating and need no auth; anyone may post a
        correctly signed entry. For approver and root changes the signed entry IS the step-up: no Approval2 is sent.
        The service records `first_seen_at` for every entry; `effective_at` is first_seen_at + 86400 for recover and
        replace_root (at once for replace_root in a single-credential log) and first_seen_at otherwise. close is
        written only by the service. Approver ops (add_approver, recover, replace_root, cancel, revoke) land on Day 5.
      x-available: day-2
      security:
        - {}
        - ownerBearer: []
      parameters:
        - $ref: '#/components/parameters/OwnerIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyLogAppendRequest'
      responses:
        '201':
          description: Appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogAppendResponse'
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request'
        '401':
          $ref: '#/components/responses/Error'
          description: 'error: unauthorized (genesis without a token)'
        '403':
          $ref: '#/components/responses/Error'
          description: 'error: log_exists (genesis for an account that already has a log)'
        '409':
          $ref: '#/components/responses/Error'
          description: 'error: seq_conflict'
        '410':
          $ref: '#/components/responses/Error'
          description: 'error: log_closed'
        '422':
          $ref: '#/components/responses/Error'
          description: 'error: invalid_entry'
        '429':
          $ref: '#/components/responses/RateLimited'
  /o/{id}/did.json:
    get:
      operationId: getOwnerDidDocument
      tags: [Key log]
      summary: The owner DID document, derived from the key log
      description: |
        Verification methods are JsonWebKey entries for the current credentials (fragment = kid). The current
        approvers (the root passkey alone in a single-credential log) are listed under authentication and
        assertionMethod. service:
        {id "#keylog", type "OpenEntityKeyLog", serviceEndpoint "https://<host>/o/<id>/log"}. A closed log serves no
