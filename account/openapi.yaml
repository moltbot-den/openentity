openapi: 3.1.0
info:
  title: Open Entity Account API
  version: 1.0.0
  summary: The OpenEntity Account service (account.openentity.org). Frozen Day 1 contract.
  license:
    name: MIT
    identifier: MIT
  description: |
    The OpenEntity Account service is the identity provider and the owner channel for the OpenEntity app and the
    Open Entity products: Moltbot Den, Secure My Agent, Agent Secret Store and ClawGRC. Sources: ADR 0007 and ADR 0008
    in the oneentity meta repo, and `docs/mobile/PLAN.md` sections 2 to 4, 8, 10.3, 11 and 13.1. Every lane builds
    against this file from Day 2. Changing a frozen shape needs a new version of this file and a note to every lane.

    ## Environments

    | | production | staging |
    |---|---|---|
    | Base URL | https://account.openentity.org | https://staging.account.openentity.org |
    | WebSocket | wss://agents.account.openentity.org/ | wss://agents.staging.account.openentity.org/ |
    | Service DID | did:web:account.openentity.org | did:web:staging.account.openentity.org |
    | Token `iss` | https://account.openentity.org | https://staging.account.openentity.org |
    | Passkey RP ID | account.openentity.org | staging.account.openentity.org |
    | Owner DIDs | `did:web:account.openentity.org:o:<id>` | `did:web:staging.account.openentity.org:o:<id>` |

    Staging products trust the staging issuer, its JWKS and its service DID only. Production products trust
    production only.

    Access-token audiences, in both environments: did:web:moltbotden.com, did:web:securemyagent.ai,
    did:web:api.agentsecretstore.com, did:web:api.clawgrc.com, and the environment's own service DID.

    ## Product signers

    Only the four product DIDs (did:web:moltbotden.com, did:web:securemyagent.ai, did:web:api.agentsecretstore.com,
    did:web:api.clawgrc.com) may call POST /v1/notify, POST /v1/events/ingest and GET /v1/paused, or sign /approve
    envelopes. Each product's DID document must list an Ed25519 key (Multikey `z6Mk...`, or JsonWebKey with kty OKP and
    crv Ed25519) under `authentication` (RFC 9421 requests) and `assertionMethod` (envelopes). On 2026-11-11
    did:web:securemyagent.ai lists only a secp256k1 key and did:web:api.agentsecretstore.com does not resolve yet; both
    add an Ed25519 key.

    ## Normative vectors

    The SDK lane's vectors win over this file wherever they differ: `test-vectors/keylog-1/` (owner key log entries,
    credentials, signatures, verifier checks in order and their error names), `test-vectors/approval-2.0/` (Approval2,
    its digest and verifier checks) and `test-vectors/pair-sas-1/` (the pairing match string). The RP ID and the owner
    DID host follow the environment: verifiers take the RP ID as an option.

    ## Service keys and rotation

    The service has three signing keys, all in AWS KMS, none ever leaving it:
    - the token key, ECC_NIST_P256, ES256: signs access tokens only; published in /.well-known/jwks.json (kid = RFC 7638
      thumbprint), not in did.json;
    - the service key, ECC_NIST_EDWARDS25519, ED25519_SHA_512: signs every call the service makes to a product, the GET
      /v1/paused response (scheme accountSignature) and the LinkOwnerEnvelope and KeyAttestationReceipt JWS; published
      in /.well-known/did.json as a Multikey under `authentication` and `assertionMethod` (fragment = RFC 7638
      thumbprint of its OKP JWK);
    - the close key, ECC_NIST_P256: signs key log `close` entries only (p256 form, low s); never deleted. did.json lists
      it and every retired close key, permanently, as JsonWebKey verification methods under `assertionMethod`
      (fragment = RFC 7638 thumbprint). Key log verifiers pass exactly those P-256 keys as `serviceKeys`, so a closed
      log keeps verifying forever.

    Rotation of the token key and the service key: every 90 days; a new key is published at least 24 hours before the
    service first signs with it; a retired key stays published at least 24 hours after its last signature. Close keys
    are never unpublished. Verifiers
    cache did.json and jwks.json for at most 10 minutes, refetch once on an unknown keyid or kid, never accept a key
    that is absent from the current document, and accept a service signature only when the keyid's DID equals the
    pinned service DID of their environment.

    ## Errors

    Every non-2xx response body is JSON `{"error": "<code>", "message": "<text>"}` (schema Error). A 429 carries
    `Retry-After` in seconds. Common codes: bad_request, unauthorized, forbidden, not_found, conflict, gone, too_large,
    invalid, agent_paused (423), approval_required (428), rate_limited (429), internal (500), unavailable (503). Each
    operation lists the codes it adds.

    ## Approvals and step-up

    Step-up and approval-gated calls carry `X-OE-Approval`: the base64url (no padding) of the UTF-8 JSON of an Approval2
    object (approval/2.0, ADR 0008). Missing: 428 approval_required. Bad: 403 approval_invalid. Expired: 403
    approval_expired. Already used: 409 approval_reused. The request id, payload and expiry come from an ApprovalRequest
    the service issued: POST /v1/step-up, a claimed pairing, or an agent-written approval.

    ## Availability

    `x-available` on each operation names the plan day its server code lands. On the two product-implemented
    endpoints it names the day the account service starts calling them. Every shape is frozen now.

    ## Decisions made in this file

    - Every `*_at` field and `expires_at` is integer Unix seconds. Event `time` is Unix milliseconds.
    - Ids other than DIDs are opaque, matching `^[A-Za-z0-9_-]{1,64}$`. Account ids are `acct_` plus 26 alphanumeric
      characters; event ids start with `evt_`.
    - RFC 9421 failures are 401 signature_invalid (the message names the failed check) or 401 signature_replayed. An
      agent call from a DID that is not paired is 403 not_paired. A product call from a DID outside the four is 403
      unknown_signer.
    - A missing, expired or invalid owner token is 401 unauthorized.
    - Web sign-in POSTs (client.platform web) must also send Origin equal to the base URL (403 bad_origin), against
      login CSRF.
    - Web Apple and Google sign-ins prove Turnstile at POST /v1/auth/nonce: `turnstile_token` is required there when
      client.platform is web.
    - A web email start without a valid Turnstile token still answers 202, but sends a code only to an address that
      already has an account (web sign-up needs Turnstile; the answer never reveals whether an account exists).
    - Every sign-in attempt consumes its nonce. After attestation_required, fetch a new nonce and retry.
    - id_token_invalid and nonce_invalid are 401. attestation_required, attestation_invalid, turnstile_required and
      turnstile_invalid are 403. A failed Apple code exchange is 502 provider_error.
    - Passkey verification failures, an unknown credential included, are 401 passkey_invalid. An unknown, used or
      expired challenge is 410 challenge_expired. Registering a second root passkey is 409 passkey_exists.
    - POST /v1/token accepts grant_type `login_code` and its metadata form `urn:openentity:login_code`.
    - invalid_audience is 400. key_log_required is 403.
    - POST /v1/pairings needs a key log (403 key_log_required). A 51st paired agent is 409 agent_limit.
    - The owner view of an agent-written approval adds `agent_did` and `approval_request` (action agent.approval). A
      decision on an expired request is 410 expired; a second decision is 409 already_decided.
    - Purchases: 422 transaction_invalid when the store signature or Play answer fails; 409 account_mismatch when the
      transaction names another account.
    - POST /v1/notify for an owner DID the service does not know is 404 owner_unknown.
    - A deletion request from an account with no key log is 409 no_key_log (use POST /v1/account/delete); a second one
      is 409 deletion_pending.
    - `vault.request:<path>` names one path pattern; grant several paths with several strings. `contract.accept<=$N`
      takes a whole or two-decimal dollar amount.
    - The owner did.json lists the current approvers (the root passkey alone in a single-credential log) under
      authentication and assertionMethod, fragment = kid; products verify approvals from the log through the
      packages, never from did.json.
    - GET /v1/sessions marks the caller's session `current: true`. POST /v1/revoke answers 200 with an empty body.
    - Polling GET /v1/pair/{pairing_id} more often than every 2 seconds is 429 rate_limited.
    - x-websocket references the frame schemas in components/schemas.
    - `seq` on agent.paused, agent.resumed and GET /v1/paused is the agent's pause-state counter; agent.permissions
      has its own counter.
    - PairStatus.owner_did is null until the owner confirms.
    - AccountEvent.type is an open string; products ignore types they do not know.
    - Google Play notifications authenticate with the Pub/Sub push OIDC token (security scheme pubsubPush).
    - Pairing fan-out: on confirm the service sends agent.paired to every product (POST /v1/oe/events) and products
      enroll the agent on it. The agent's first bearer keys come from each product's POST /v1/oe/credentials/renew,
      asked for when the agent first reads its confirmed pairing; the service passes them through and stores none.
    - A claim by an agent that is paired with another owner is 409 agent_linked: that owner unlinks it first, so a
      paused agent cannot pair itself to a second account.
    - API Gateway cannot choose the close code of a socket the server closes, so before closing the service sends a
      last error frame whose `close_code` is the code listed under closeCodes (4001, 4003, 4008). SDKs treat that frame
      as the close.
servers:
  - url: https://account.openentity.org
    description: production
  - url: https://staging.account.openentity.org
    description: staging
tags:
  - name: Well-known
    description: Public discovery documents. No auth.
  - name: Sign-in
    description: Apple, Google, passkeys and the 8-digit email code (PLAN 2.3). No passwords exist.
  - name: Tokens and sessions
    description: Refresh-token rotation and one-audience access tokens (PLAN 2.4).
  - name: Account
    description: The signed-in owner's account, sign-in methods, push tokens and deletion.
  - name: Key log
    description: Owner DID documents and hash-chained key logs (PLAN 3, ADR 0007).
  - name: Pairing
    description: Owner side of pairing an agent (PLAN 8.1).
  - name: Agents
    description: The owner's paired agents, pause, resume, commands and messages (PLAN 8.2, 8.3).
  - name: Agent-written approvals
    description: Approvals an agent writes through the service. The service is the verifier; no product accepts them.
  - name: Agent API
    description: Called by agents, signed with RFC 9421 by the agent's did:key. No CAPTCHA, login or payment.
  - name: Product to account
    description: Called by product backends, signed with RFC 9421 by the product's DID.
  - name: Analytics
    description: App events (PLAN 13.1). The Monitoring lane owns account/analytics/events.yaml.
  - name: Store
    description: |
      App Store and Google Play purchase events (PLAN 10.3). Product ids, the same on both stores, and the plan each
      grants (account/src/store.ts CATALOG): org.openentity.app.sma.pro.monthly (Secure My Agent pro),
      org.openentity.app.sma.team.monthly (team), org.openentity.app.ass.solo.monthly and .ass.solo.yearly (Agent Secret
      Store solo), org.openentity.app.ass.team.monthly and .ass.team.yearly (team), org.openentity.app.clawgrc.starter.monthly
      (ClawGRC starter), org.openentity.app.denpro.monthly (Moltbot Den den_pro), and the consumables
      org.openentity.app.credits.500, .credits.2200 and .credits.6000 (credits_500, credits_2200, credits_6000). Staging
      grants sandbox purchases only; production grants App Store Production and non-test Play purchases only, plus the
      App Review demo account's sandbox purchases while APP_REVIEW_OPEN is on.
  - name: Web approvals
    description: Approvals on account.openentity.org without the phone (PLAN 3.5).
  - name: Implemented by products
    description: Endpoints each product implements and the account service calls, signed with accountSignature.
x-websocket:
  summary: Agent channel (PLAN 8.2). The downlink for owner messages, commands, approval results and permissions.
  x-available: day-3
  urls:
    production: wss://agents.account.openentity.org/
    staging: wss://agents.staging.account.openentity.org/
  connect:
    description: |
      $connect is the HTTP GET upgrade. It carries the agentSignature headers (Signature-Input and Signature) with
      "@method" GET and "@target-uri" exactly the URL above, trailing slash included. There is no body, so there is no
      Content-Digest. Only a paired agent DID connects; a paused agent may connect, so a resume command can reach it.
      One socket per agent: a newer socket closes the older one with 4008. A rejected upgrade gets 401 (bad signature)
      or 403 (not paired or unlinked).
  routeSelectionExpression: $request.body.action
  limits:
    idle_timeout_seconds: 600
    heartbeat_interval_seconds: 540
    max_connection_seconds: 7200
    max_frame_bytes: 32768
    max_message_bytes: 131072
  limitsDescription: |
    API Gateway closes a socket idle for 10 minutes, so the agent sends {"action":"heartbeat"} every 9 minutes; a MOCK
    route answers {"type":"heartbeat"} with no Lambda. Every socket ends at 2 hours; reconnect. A frame is at most
    32 KB and a message at most 128 KB.
  clientFrames:
    sync:
      $ref: '#/components/schemas/WsSync'
    ack:
      $ref: '#/components/schemas/WsAck'
    heartbeat:
      $ref: '#/components/schemas/WsHeartbeat'
  serverFrames:
    message:
      $ref: '#/components/schemas/WsMessage'
    command:
      $ref: '#/components/schemas/WsCommand'
    approval.result:
      $ref: '#/components/schemas/WsApprovalResult'
    permissions:
      $ref: '#/components/schemas/WsPermissions'
    heartbeat:
      $ref: '#/components/schemas/WsHeartbeatReply'
    error:
      $ref: '#/components/schemas/WsError'
  delivery: |
    Items stay until the agent acknowledges them, with {"action":"ack","ids":[...]} or POST /v1/agent/messages/ack.
    After {"action":"sync"} the server sends every unacknowledged item, oldest first, up to 100; sync again after
    acknowledging to get more. The server also pushes new items as they arrive.
  closeCodes:
    description: Carried as `close_code` in the last error frame before the server closes the socket (API Gateway sends its own close code).
    '4001': The agent was paused. Reconnecting is allowed, so a resume command can arrive; products refuse the agent until it is resumed.
    '4003': The agent was unlinked or is not paired. Do not reconnect.
    '4008': Replaced by a newer socket from the same agent.
    '1011': Server error. Reconnect with backoff.
paths:
  /.well-known/apple-app-site-association:
    get:
      operationId: getAppleAppSiteAssociation
      tags: [Well-known]
      summary: Associated domains file for the iOS app (passkeys and universal links)
      description: Status 200, Content-Type application/json, no redirect, so Apple's CDN can fetch it. The staging host serves the same file.
      x-available: day-1
      security: []
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleAppSiteAssociation'
              example:
                applinks:
                  details:
                    - appIDs: [7R835D5LDZ.org.openentity.app]
                      components:
                        - /: /app/*
                webcredentials:
                  apps: [7R835D5LDZ.org.openentity.app]
  /.well-known/assetlinks.json:
    get:
      operationId: getAssetLinks
      tags: [Well-known]
      summary: Digital Asset Links for the Android app (App Links and passkeys)
      description: 404 until the Play App Signing fingerprints exist (Day 2).
      x-available: day-1
      security: []
      responses:
        '200':
          description: The statement list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetLinks'
        '404':
          $ref: '#/components/responses/Error'
          description: 'error: not_found (no fingerprints yet)'
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [Well-known]
      summary: Public keys of the ES256 token key
      description: Cache-Control public, max-age=600. During a rotation both keys are listed (see Service keys and rotation).
      x-available: day-1
      security: []
      responses:
        '200':
          description: The key set.
          headers:
            Cache-Control:
              schema: { type: string, const: 'public, max-age=600' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
  /.well-known/openid-configuration:
    get:
      operationId: getAuthorizationServerMetadata
      tags: [Well-known]
      summary: Issuer metadata (RFC 8414 fields that are true for this service)
      x-available: day-1
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerMetadata'
  /.well-known/did.json:
    get:
      operationId: getServiceDidDocument
      tags: [Well-known]
      summary: The service DID document (did:web:account.openentity.org)
      description: |
        Holds the Ed25519 service key as a Multikey under `authentication` and `assertionMethod` (the accountSignature
        key), and the P-256 close keys, current and every retired one, as JsonWebKey verification methods under
        `assertionMethod` (fragment = RFC 7638 thumbprint): the signers of key log `close` entries and the verifiers'
        `serviceKeys`. The access-token key is in /.well-known/jwks.json only. Cache at most 10 minutes.
      x-available: day-1
      security: []
      responses:
        '200':
          description: The DID document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DidDocument'
  /v1/health:
    get:
      operationId: getHealth
      tags: [Well-known]
      summary: Liveness
      x-available: day-1
      security: []
      responses:
        '200':
          description: Up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/auth/nonce:
    post:
      operationId: createAuthNonce
      tags: [Sign-in]
      summary: Issue a single-use sign-in nonce
      description: |
        The nonce is single use, valid 600 seconds, and bound to `client.install_id` (apps) or to a `__Host-oe_state`
        cookie (web; SameSite=None, 10 minutes). Every provider nonce is the lowercase hex SHA-256 of this raw nonce: the
        app passes that hash to Apple or Google, sends the raw nonce here, and the service compares the token's `nonce`
        claim with the hash. The App Attest clientDataHash and the Android attestation challenge on the first sign-in
        also derive from it (Attestation). flow `apple_web` (web and Android) also returns `state` and Apple's
        `authorize_url`. Rate limited per IP and per install (429 rate_limited).
      x-available: day-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NonceRequest'
      responses:
        '200':
          description: The nonce.
          headers:
            Set-Cookie:
              description: Web only. `__Host-oe_state=<opaque>; Path=/; Secure; HttpOnly; SameSite=None; Max-Age=600`.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonceResponse'
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request'
        '403':
          $ref: '#/components/responses/Error'
          description: 'error: bad_origin, turnstile_required, turnstile_invalid (web)'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/apple:
    post:
      operationId: signInWithAppleNative
      tags: [Sign-in]
      summary: Sign in with Apple, native iOS sheet
      description: |
        Checks the identity token: `iss` https://appleid.apple.com, `aud` org.openentity.app, `nonce`, `exp`, signature
        from https://appleid.apple.com/auth/keys (the `alg` in the token header, RS256 today). Then exchanges the
        authorization code at Apple and keeps Apple's refresh token encrypted, so account deletion can revoke it.
        `attestation` is required on the first sign-in from an install (403 attestation_required). A verified email
        that matches another account is 409 account_exists: accounts never merge silently. Rate limited per IP and
        per install.
      x-available: day-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request'
        '401':
          $ref: '#/components/responses/Error'
          description: 'error: id_token_invalid, nonce_invalid'
        '403':
          $ref: '#/components/responses/Error'
          description: 'error: attestation_required, attestation_invalid'
        '409':
          $ref: '#/components/responses/AccountExists'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/Error'
          description: 'error: provider_error (Apple code exchange failed)'
  /v1/auth/apple/callback:
    post:
      operationId: appleCallback
      tags: [Sign-in]
      summary: Apple form_post return for the web and Android flows
      description: |
        Apple POSTs here after the authorize URL from POST /v1/auth/nonce (flow apple_web). `aud` is the Services ID;
        `state` must match the nonce record (and, on the web, the `__Host-oe_state` cookie). Web: sets the session
        cookie and redirects to `return_to` or `/`. Android: redirects to the App Link
        `https://<host>/app/auth?login_code=<code>`; the code is single use, valid 120 seconds, and is redeemed at POST
        /v1/token with grant_type login_code. Errors redirect to `/app/auth?error=<code>` with one of: state_invalid,
        id_token_invalid, nonce_invalid, account_exists, provider_error.
      x-available: day-1
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppleCallbackForm'
      responses:
        '303':
          description: Redirect (success or error).
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
  /v1/auth/apple/notifications:
    post:
      operationId: appleServerNotification
      tags: [Sign-in]
      summary: Sign in with Apple server-to-server notifications
      description: |
        Apple POSTs {"payload": "<Apple-signed JWT>"}. Verified with Apple's keys; `aud` is the bundle ID or the Services
        ID. The `events` claim may be an object or a JSON string. Types: email-disabled, email-enabled (update the
        account email state), consent-revoked, account-delete and account-deleted (both spellings; end every session of
        that Apple identity). Answers 200 for unknown subjects too.
      x-available: day-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleNotificationRequest'
      responses:
        '200':
          description: Processed.
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request'
        '401':
          $ref: '#/components/responses/Error'
          description: 'error: payload_invalid'
  /v1/auth/google:
    post:
      operationId: signInWithGoogle
      tags: [Sign-in]
      summary: Sign in with a Google ID token
      description: |
        `iss` https://accounts.google.com or accounts.google.com; `aud` the iOS OAuth client ID or the web client ID
        (Android Credential Manager tokens carry the web client ID); `nonce`; `exp`; keys from
        https://www.googleapis.com/oauth2/v3/certs. The email is used only when `email_verified` is true. Attestation,
        account_exists and rate limits as for Apple.
      x-available: day-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request'
        '401':
          $ref: '#/components/responses/Error'
          description: 'error: id_token_invalid, nonce_invalid'
        '403':
          $ref: '#/components/responses/Error'
          description: 'error: attestation_required, attestation_invalid, bad_origin'
        '409':
          $ref: '#/components/responses/AccountExists'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/auth/passkey/options:
    post:
      operationId: passkeyOptions
      tags: [Sign-in]
      summary: WebAuthn options for passkey sign-in or root passkey registration
      description: |
        mode `authenticate`: no auth; a discoverable-credential request (empty allowCredentials), userVerification
        required, timeout 300000 ms, RP ID of the environment. mode `register`: ownerBearer required; allowed for the
        onboarding root passkey (an account with no key log and no passkey) and, from Day 5, for a passkey that is about
        to be offered to the key log (POST /v1/keylog/enrollments: an approver passkey or a new root). A passkey only for
        signing in is step-up method.add (POST /v1/account/methods). The challenge is single use and valid 300 seconds.
      x-available: day-1
      security:
        - {}
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyOptionsRequest'
      responses:
        '200':
          description: Options in WebAuthn Level 3 JSON form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptionsResponse'
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request'
        '401':
          $ref: '#/components/responses/Error'
          description: 'error: unauthorized (register without a token)'
        '409':
          $ref: '#/components/responses/Error'
          description: 'error: passkey_exists'
        '429':
