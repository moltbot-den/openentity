  /v1/oe/events:
    post:
      operationId: productReceiveEvent
      tags: [Implemented by products]
      summary: Receive a signed event from the account service
      description: |
        Implemented by each product. The account service signs the call with accountSignature. Verify it (keyid's DID
        equals the pinned service DID; key from the service did.json), then handle the AccountEvent:
        - agent.paired: enroll the agent under the owner with these permissions (create it, or reactivate it after an
          agent.unlinked); the service then calls POST /v1/oe/credentials/renew for its first key;
        - agent.paused: refuse every request authenticated as that agent DID or its keys with 423 agent_paused
          (Agent Secret Store also suspends its scoped tokens and gateway access; Moltbot Den holds contract actions);
        - agent.resumed: lift that;
        - agent.unlinked: revoke the agent's credentials;
        - agent.permissions: replace the agent's permissions;
        - owner.deleted: this IS the owner-delete call; delete the owner's data;
        - plan.changed: this IS the signed plan-grant call; grant or end the plan and record `source`.
        Products need no other endpoint for owner deletion or plan grants. Dedupe `id` for at least 24 hours (a
        duplicate gets 204 again). Apply agent states only when `seq` is newer than the one held. An unknown type gets
        204 and is ignored.
      x-available: day-3
      servers:
        - url: https://{product_api}
          variables:
            product_api:
              default: product.example
              description: The product's API host.
      security:
        - accountSignature: []
      parameters:
        - $ref: '#/components/parameters/SignatureInputHeader'
        - $ref: '#/components/parameters/ContentDigestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEvent'
      responses:
        '204':
          description: Handled, duplicate, or unknown type.
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request'
        '401':
          $ref: '#/components/responses/Error'
          description: 'error: signature_invalid (bad signature, or a keyid not on the service DID)'
  /v1/oe/credentials/renew:
    post:
      operationId: productRenewAgentCredential
      tags: [Implemented by products]
      summary: Issue a fresh bearer key for a paired agent (the account service calls this)
      description: |
        Implemented by each product that issues agent bearer keys (Moltbot Den moltbotden_sk_, Secure My Agent sma_,
        Agent Secret Store ass_, ClawGRC cgrc_; PLAN 8.4). The account service calls it when an agent calls POST
        /v1/agent/credentials/renew, signed with accountSignature. Verify it as for POST /v1/oe/events (the keyid's DID
        is the pinned service DID).

        The product issues a new key for `agent_did`, scoped to `permissions` and valid 30 days, and keeps every older
        key of that agent valid for exactly 1 hour more (`previous_valid_until`), then revokes them. Idempotent on
        `request_id`: a retry with the same request_id within 1 hour returns the same key, never a second one. A paused
        agent still gets its key (pause is enforced on use, 423 agent_paused). An agent the product does not know, or
        one that agent.unlinked removed, is 404 agent_unknown.
      x-available: day-3
      servers:
        - url: https://{product_api}
          variables:
            product_api:
              default: product.example
              description: The product's API host.
      security:
        - accountSignature: []
      parameters:
        - $ref: '#/components/parameters/SignatureInputHeader'
        - $ref: '#/components/parameters/ContentDigestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCredentialRenewRequest'
      responses:
        '200':
          description: The new key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCredentialRenewal'
        '401':
          $ref: '#/components/responses/Error'
          description: 'error: signature_invalid'
        '404':
          $ref: '#/components/responses/Error'
          description: 'error: agent_unknown'
  /v1/oe/keylog:
    post:
      operationId: productReceiveKeyLog
      tags: [Implemented by products]
      summary: Receive owner key log entries from any source
      description: |
        Implemented by each product. No auth: entries are self-authenticating. The app sends revoke and cancel entries
        here directly, so a hidden entry still arrives. Entries arrive as their exact JCS lines (`lines`); keep and
        hash those bytes, never a re-encoding. Verify through the openentity packages (verifyKeyLog with the
        environment's rpId and origins, and serviceKeys = the P-256 close keys of the service did.json); fetch missing earlier
        lines from GET /o/{id}/log; record `first_seen_at` for every entry and run every delay from it.
      x-available: day-5
      servers:
        - url: https://{product_api}
          variables:
            product_api:
              default: product.example
              description: The product's API host.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OeKeylogRequest'
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OeKeylogResponse'
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request'
        '409':
          $ref: '#/components/responses/Error'
          description: 'error: fork (a different entry already holds that seq; the product raises an alert)'
        '422':
          $ref: '#/components/responses/Error'
          description: 'error: invalid_entry'
components:
  securitySchemes:
    ownerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token from POST /v1/token or a sign-in whose `aud` is the environment's service DID (AccessTokenClaims).
    webSession:
      type: apiKey
      in: cookie
      name: __Host-oe_session
      description: |
        The web refresh token: `__Host-oe_session=<token>; Path=/; Secure; HttpOnly; SameSite=Strict`, valid 12 hours
        from sign-in (absolute). Cookie-authenticated POSTs must send Origin equal to the base URL, else 403 bad_origin.
    agentSignature:
      type: apiKey
      in: header
      name: Signature
      description: |
        RFC 9421 HTTP message signature, OEIS-1 profile, exactly as @openentity/sdk signRequest emits it.
        - `Signature-Input: sig1=("@method" "@target-uri" "content-digest");created=<unix>;expires=<unix>;nonce="<base64url>";keyid="<agent did:key>";alg="ed25519"`
        - `Signature: sig1=:<base64 of the 64-byte Ed25519 signature>:`
        - `Content-Digest: sha-256=:<base64 of SHA-256(body)>:` (RFC 9530), present and covered when the body is
          non-empty. With an empty body both the header and the "content-digest" component are omitted.

        Signature base (RFC 9421 section 2.5): one line per covered component, in order (`"@method": POST`,
        `"@target-uri": https://account.openentity.org/v1/pair`, `"content-digest": sha-256=:...:`), then
        `"@signature-params": ` followed by the Signature-Input value after `sig1=`. Lines are joined by LF, with no
        trailing LF.

        Rules: label sig1 only; alg ed25519 only; covered components exactly ("@method" "@target-uri") or ("@method"
        "@target-uri" "content-digest"); keyid an Ed25519 did:key; created, expires, nonce, keyid and alg all present;
        expires - created at most 300; created at most 5 seconds in the future and at most 300 seconds old; expires not
        past; nonce at least 22 base64url characters (16 random bytes), single use per keyid while the signature is
        valid. @method is the uppercase method. @target-uri is the full URL as sent: https, the environment host, path
        and query.

        Failures: 401 signature_invalid, whose message names the check (missing_headers, unknown_alg, bad_keyid,
        missing_nonce, digest_mismatch, created_in_future, created_too_old, expired, lifetime_too_long, bad_signature);
        401 signature_replayed.
    productSignature:
      type: apiKey
      in: header
      name: Signature
      description: |
        The agentSignature profile, except that keyid is a DID URL `<product DID>#<fragment>` naming an Ed25519
        verification method listed under `authentication` in the product's did:web document. The service fetches the
        document over HTTPS, caches it 10 minutes and refetches once on an unknown keyid. Only the four product DIDs
        are accepted (else 403 unknown_signer). Failures: 401 signature_invalid, 401 signature_replayed.
    accountSignature:
      type: apiKey
      in: header
      name: Signature
      description: |
        The service's signature on every call it makes to a product: the agentSignature profile (label sig1;
        alg="ed25519"; covered ("@method" "@target-uri" "content-digest"); created, expires, nonce, keyid and alg;
        window at most 300 seconds; nonce single use) with keyid
        `did:web:account.openentity.org#<RFC 7638 thumbprint of the Ed25519 OKP JWK>` (staging:
        `did:web:staging.account.openentity.org#<thumbprint>`). The private key is an AWS KMS ECC_NIST_EDWARDS25519 key
        (ED25519_SHA_512) and never leaves KMS. @target-uri is the product endpoint URL as called.

        Products: pin the service DID of their environment and reject a keyid whose DID differs; resolve the key from
        https://<service host>/.well-known/did.json (a Multikey `z6Mk...` under `authentication`); cache at most 10
        minutes; refetch once on an unknown keyid; never accept a key absent from the current document; remember each
        nonce for 300 seconds. Failure: 401 signature_invalid.
    installToken:
      type: apiKey
      in: header
      name: X-OE-Install-Token
      description: From POST /v1/installs. Accepted only on POST /v1/events, before sign-up.
    pubsubPush:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The Google-signed OIDC token of the Pub/Sub push subscription's service account.
  parameters:
    ApprovalHeader:
      name: X-OE-Approval
      in: header
      required: true
      description: base64url (no padding) of the UTF-8 JSON of an Approval2 object that signs the matching ApprovalRequest.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 8192 }
    ApprovalHeaderConditional:
      name: X-OE-Approval
      in: header
      required: false
      description: As X-OE-Approval elsewhere; required only in the cases the operation describes.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 8192 }
    AppAttestHeader:
      name: X-OE-App-Attest
      in: header
      required: false
      description: |
        iOS, refresh_token grant. base64url of the App Attest assertion (CBOR) made with the install's attested key,
        clientDataHash = SHA-256(raw request body). Missing: 401 binding_required. Bad: 401 binding_invalid.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 4096 }
    DeviceSignatureHeader:
      name: X-OE-Device-Signature
      in: header
      required: false
      description: |
        Android, refresh_token grant. base64url of the DER ECDSA P-256 SHA-256 signature over the raw request body by the
        Keystore key registered at the install's first sign-in.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 200 }
    PlayIntegrityHeader:
      name: X-OE-Play-Integrity
      in: header
      required: false
      description: Android, refresh_token grant. A Play Integrity standard-request token whose requestHash is the lowercase hex SHA-256 of the raw request body.
      schema: { type: string, maxLength: 8192 }
    SignatureInputHeader:
      name: Signature-Input
      in: header
      required: true
      description: RFC 9421 Signature-Input (see the operation's security scheme).
      schema: { type: string, maxLength: 2048 }
    ContentDigestHeader:
      name: Content-Digest
      in: header
      required: false
      description: RFC 9530 `sha-256=:<base64>:`. Required, and covered by the signature, when the body is non-empty.
      schema: { type: string, pattern: '^sha-256=:[A-Za-z0-9+/]{43}=:$' }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OpaqueId' }
    InstallIdPath:
      name: install_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OwnerIdPath:
      name: id
      in: path
      required: true
      description: The owner id, the last segment of the owner DID.
      schema: { type: string, pattern: '^[a-z2-7]{52}$' }
    AgentDidPath:
      name: agent_did
      in: path
      required: true
      description: The agent's did:key as is (":" is a valid path character); percent-encoded forms are also accepted.
      schema: { $ref: '#/components/schemas/AgentDid' }
  headers:
    SessionCookie:
      description: Web only. `__Host-oe_session=<refresh token>; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=<seconds left of the 12 hours>`.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 'error: rate_limited'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountExists:
      description: 'error: account_exists. The verified email belongs to an account with other methods: sign in with one of `methods`, then link this one with POST /v1/account/methods.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorAccountExists'
    CodeInvalid:
      description: 'error: code_invalid, with `tries_left`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorCodeInvalid'
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: Machine-readable code. }
        message: { type: string, description: Human-readable text; it may change. }
    ErrorAccountExists:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [methods]
          properties:
            methods:
              type: array
              items: { $ref: '#/components/schemas/MethodType' }
    ErrorCodeInvalid:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [tries_left]
          properties:
            tries_left: { type: integer, minimum: 0, maximum: 4 }
    Did:
      type: string
      pattern: '^did:[a-z0-9]+:[A-Za-z0-9._%:-]*[A-Za-z0-9._%-]$'
      maxLength: 512
    ServiceDid:
      type: string
      enum: ['did:web:account.openentity.org', 'did:web:staging.account.openentity.org']
      description: The environment's service DID. Each environment uses only its own.
    ProductDid:
      type: string
      enum: ['did:web:moltbotden.com', 'did:web:securemyagent.ai', 'did:web:api.agentsecretstore.com', 'did:web:api.clawgrc.com']
    AudienceDid:
      type: string
      enum:
        - 'did:web:moltbotden.com'
        - 'did:web:securemyagent.ai'
        - 'did:web:api.agentsecretstore.com'
        - 'did:web:api.clawgrc.com'
        - 'did:web:account.openentity.org'
        - 'did:web:staging.account.openentity.org'
      description: One access-token audience. Each environment accepts the four product DIDs and its own service DID.
    AgentDid:
      type: string
      pattern: '^did:key:z6Mk[1-9A-HJ-NP-Za-km-z]+$'
      maxLength: 128
      description: An agent EID, an Ed25519 did:key.
    OwnerDid:
      type: string
      pattern: '^did:web:(staging\.)?account\.openentity\.org:o:[a-z2-7]{52}$'
    Hex64:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Base64url:
      type: string
      pattern: '^[A-Za-z0-9_-]*$'
    CompactJws:
      type: string
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
      maxLength: 16384
    UnixSeconds:
      type: integer
      minimum: 0
    OpaqueId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
    RequestId:
      type: string
      pattern: '^[A-Za-z0-9:._-]{1,128}$'
    RawNonce:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: The raw nonce from POST /v1/auth/nonce.
    Thumbprint:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: RFC 7638 JWK thumbprint, base64url of the SHA-256.
    Permission:
      type: string
      maxLength: 256
      pattern: '^(owner\.message|owner\.status|owner\.approval|vault\.request:\S+|evidence\.file|den\.post|market\.sell|contract\.accept<=\$[0-9]+(\.[0-9]{1,2})?)$'
      description: |
        An agent permission (PLAN 7.6): owner.message, owner.status, owner.approval, vault.request:<path pattern> (one
        path per string), evidence.file, den.post, market.sell, contract.accept<=$N (whole or two-decimal dollars).
    Platform:
      type: string
      enum: [ios, android, web]
    MethodType:
      type: string
      enum: [apple, google, passkey, email]
    AppleAppSiteAssociation:
      type: object
      required: [applinks, webcredentials]
      properties:
        applinks:
          type: object
          required: [details]
          properties:
            details:
              type: array
              items:
                type: object
                required: [appIDs, components]
                properties:
                  appIDs:
                    type: array
                    items: { type: string, const: 7R835D5LDZ.org.openentity.app }
                  components:
                    type: array
                    items:
                      type: object
                      additionalProperties: { type: string }
        webcredentials:
          type: object
          required: [apps]
          properties:
            apps:
              type: array
              items: { type: string, const: 7R835D5LDZ.org.openentity.app }
    AssetLinks:
      type: array
      items:
        type: object
        required: [relation, target]
        properties:
          relation:
            type: array
            items:
              type: string
              enum: [delegate_permission/common.handle_all_urls, delegate_permission/common.get_login_creds]
          target:
            type: object
            required: [namespace, package_name, sha256_cert_fingerprints]
            properties:
              namespace: { type: string, const: android_app }
              package_name: { type: string, const: org.openentity.app }
              sha256_cert_fingerprints:
                type: array
                items: { type: string, pattern: '^([0-9A-F]{2}:){31}[0-9A-F]{2}$' }
    Jwk:
      type: object
      required: [kty, crv, x, y, kid, alg, use]
      properties:
        kty: { type: string, const: EC }
        crv: { type: string, const: P-256 }
        x: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        y: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        kid: { $ref: '#/components/schemas/Thumbprint' }
        alg: { type: string, const: ES256 }
        use: { type: string, const: sig }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Jwk' }
    IssuerMetadata:
      type: object
      required: [issuer, jwks_uri, token_endpoint, revocation_endpoint, grant_types_supported, response_types_supported, token_endpoint_auth_methods_supported]
      properties:
        issuer: { type: string, format: uri }
        jwks_uri: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        revocation_endpoint: { type: string, format: uri }
        grant_types_supported:
          type: array
          items: { type: string, enum: [refresh_token, 'urn:openentity:login_code'] }
        response_types_supported:
          type: array
          maxItems: 0
          description: Empty; the service has no authorization endpoint.
        token_endpoint_auth_methods_supported:
          type: array
          items: { type: string, const: none }
      example:
        issuer: https://account.openentity.org
        jwks_uri: https://account.openentity.org/.well-known/jwks.json
        token_endpoint: https://account.openentity.org/v1/token
        revocation_endpoint: https://account.openentity.org/v1/revoke
        grant_types_supported: [refresh_token, 'urn:openentity:login_code']
        response_types_supported: []
        token_endpoint_auth_methods_supported: [none]
    DidDocument:
      type: object
      required: ['@context', id, verificationMethod]
      properties:
        '@context':
          type: array
          items: { type: string }
          examples:
            - ['https://www.w3.org/ns/did/v1', 'https://w3id.org/security/multikey/v1', 'https://w3id.org/security/jwk/v1']
        id: { $ref: '#/components/schemas/Did' }
        verificationMethod:
          type: array
          items: { $ref: '#/components/schemas/VerificationMethod' }
        authentication:
          type: array
          items: { type: string, description: A DID URL from verificationMethod. }
        assertionMethod:
          type: array
          items: { type: string, description: A DID URL from verificationMethod. }
        service:
          type: array
          items:
            type: object
            required: [id, type, serviceEndpoint]
            properties:
              id: { type: string }
              type: { type: string }
              serviceEndpoint: { type: string, format: uri }
    VerificationMethod:
      type: object
      required: [id, type, controller]
      properties:
        id: { type: string, description: 'DID URL; the fragment is the key''s RFC 7638 thumbprint.' }
        type: { type: string, enum: [Multikey, JsonWebKey] }
        controller: { $ref: '#/components/schemas/Did' }
        publicKeyMultibase: { type: string, pattern: '^z6Mk[1-9A-HJ-NP-Za-km-z]+$', description: Multikey (the Ed25519 service key). }
        publicKeyJwk: { type: object, description: 'JsonWebKey (a service close key, or an owner credential).' }
    Health:
      type: object
      required: [ok, stage, version]
      properties:
        ok: { type: boolean, const: true }
        stage: { type: string, enum: [production, staging] }
        version: { type: string, description: The deployed git commit. }
    ClientInfo:
      type: object
      required: [platform]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        install_id: { type: string, format: uuid, description: 'Random per install, kept in the Keychain or Keystore. Required on ios and android.' }
        app_version: { type: string, maxLength: 32 }
        os_version: { type: string, maxLength: 32 }
        device_model: { type: string, maxLength: 64 }
      allOf:
        - if:
            properties:
              platform: { enum: [ios, android] }
          then:
            required: [install_id]
    Attestation:
      description: Sent on the first sign-in from an install, and whenever a response says attestation_required. It binds the install's refresh tokens to its key.
      oneOf:
        - $ref: '#/components/schemas/AppAttestAttestation'
        - $ref: '#/components/schemas/AndroidKeyAttestation'
      discriminator:
        propertyName: type
        mapping:
          app_attest: '#/components/schemas/AppAttestAttestation'
          android_key: '#/components/schemas/AndroidKeyAttestation'
    AppAttestAttestation:
      type: object
      required: [type, key_id, attestation_object]
      properties:
        type: { type: string, const: app_attest }
        key_id: { type: string, maxLength: 128, description: The base64 key identifier from DCAppAttestService.generateKey. }
        attestation_object: { type: string, pattern: '^[A-Za-z0-9_-]+$', description: 'base64url CBOR from attestKey, clientDataHash = SHA-256(UTF-8 of the raw nonce).' }
    AndroidKeyAttestation:
      type: object
      required: [type, certificate_chain, integrity_token]
      properties:
        type: { type: string, const: android_key }
        certificate_chain:
          type: array
          minItems: 2
          items: { type: string, description: base64 DER certificate. }
          description: Leaf first. The leaf certifies the hardware-backed Keystore P-256 key that later signs refresh calls; its attestationChallenge is the UTF-8 bytes of the raw nonce.
        integrity_token: { type: string, maxLength: 8192, description: 'A Play Integrity standard-request token, requestHash = lowercase hex SHA-256(UTF-8 of the raw nonce).' }
    NonceRequest:
      type: object
      required: [client]
      properties:
        client: { $ref: '#/components/schemas/ClientInfo' }
        flow: { type: string, enum: [native, apple_web], default: native }
        return_to: { type: string, maxLength: 512, pattern: '^/(?![/\\])', description: Web only. A same-origin path to land on after Apple sign-in. }
        turnstile_token: { type: string, maxLength: 2048, description: Required when client.platform is web. }
    NonceResponse:
      type: object
      required: [nonce, expires_at]
      properties:
        nonce: { $ref: '#/components/schemas/RawNonce', description: '32 random bytes, base64url. Send the raw value to this service; give providers its lowercase hex SHA-256.' }
        expires_at: { $ref: '#/components/schemas/UnixSeconds', description: now + 600. }
        state: { type: string, maxLength: 128, description: apple_web only. }
        authorize_url:
          type: string
          format: uri
          description: |
            apple_web only. https://appleid.apple.com/auth/authorize with client_id = the Services ID, redirect_uri =
            https://<host>/v1/auth/apple/callback, response_type = "code id_token", scope = "name email",
            response_mode = form_post, state, and nonce = lowercase hex SHA-256(nonce).
    AppleSignInRequest:
      type: object
      required: [identity_token, authorization_code, nonce, client]
      properties:
        identity_token: { $ref: '#/components/schemas/CompactJws' }
        authorization_code: { type: string, maxLength: 1024 }
        nonce: { $ref: '#/components/schemas/RawNonce' }
        client: { $ref: '#/components/schemas/ClientInfo' }
        attestation: { $ref: '#/components/schemas/Attestation' }
        user: { $ref: '#/components/schemas/AppleUser' }
    AppleUser:
      type: object
      description: First sign-in only. Apple sends the name only once; the identity token never carries it.
      properties:
        name:
          type: object
          properties:
            firstName: { type: string, maxLength: 100 }
            lastName: { type: string, maxLength: 100 }
        email: { type: string, format: email }
    AppleCallbackForm:
      type: object
      required: [code, id_token, state]
      properties:
        code: { type: string, description: 'Single use, valid 5 minutes.' }
        id_token: { $ref: '#/components/schemas/CompactJws' }
        state: { type: string }
        user: { type: string, description: 'JSON text {"name": {"firstName", "lastName"}, "email"}, first authorization only.' }
    AppleNotificationRequest:
      type: object
      required: [payload]
      properties:
        payload: { $ref: '#/components/schemas/CompactJws' }
    GoogleSignInRequest:
      type: object
      required: [id_token, nonce, client]
      properties:
        id_token: { $ref: '#/components/schemas/CompactJws' }
        nonce: { $ref: '#/components/schemas/RawNonce' }
        client: { $ref: '#/components/schemas/ClientInfo' }
        attestation: { $ref: '#/components/schemas/Attestation' }
    PasskeyOptionsRequest:
      type: object
