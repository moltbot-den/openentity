    get:
      operationId: listPaused
      tags: [Product to account]
      summary: Pause changes for agents provisioned in the calling product (signed response)
      description: |
        Poll every 30 seconds. Without `since`: every currently paused agent provisioned in the product, as state
        paused. With `since`: changes after that cursor, oldest first. Apply a change only if its `seq` is newer than
        the one you hold for that agent. The response is signed by the service (RFC 9421 response signature):
        Signature-Input `sig1=("@status" "content-digest");created=<unix>;expires=<unix>;keyid="<service DID>#<thumbprint>";alg="ed25519"`
        (expires - created at most 60, no nonce), Signature `sig1=:<base64>:`, Content-Digest `sha-256=:<base64>:`.
        The signature base is three lines joined by LF: `"@status": 200`, `"content-digest": <header value>`,
        `"@signature-params": <the Signature-Input value after "sig1=">`. Verify with the same key resolution as
        accountSignature, check `since` equals the cursor you sent, then advance to `cursor`.
