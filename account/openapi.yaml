  /v1/keylog/attestations:
    post:
      operationId: attestApproverKey
      tags: [Key log]
      summary: Attest a device approver key before it goes into a key log entry
      description: |
        Call before signing a genesis, add_approver or recover entry that carries a device key (type p256). The client
        proves the key with the platform attestation, and the service verifies it against Apple's and Google's roots.
        If it passes, the service returns a receipt (KeyAttestationReceipt): a compact JWS signed by the service key,
        the Ed25519 key of accountSignature in /.well-known/did.json. The client copies the receipt's `key_storage`,
        `attestation.type`, `attestation.verified` and (Android) `integrity` into the Credential, puts the JWS itself in
        `attestation.receipt`, then signs the entry. Verifiers may check a receipt against did.json; a key log's
        validity never depends on it (test-vectors/keylog-1).

        Binding: `nonce` comes from POST /v1/auth/nonce (single use), and kid is the RFC 7638 thumbprint of `jwk`, the
        key's SHA-256.
        - iOS: an App Attest attestation of a new App Attest key, with clientDataHash = SHA-256(UTF-8(nonce + "|" +
          kid)). The service checks the chain to the Apple App Attestation root, the nonce extension, the RP ID hash of
          7R835D5LDZ.org.openentity.app, counter 0 and the production AAGUID (development in staging). key_storage is
          secure_enclave.
        - Android: the Key Attestation certificate chain of the approver key itself (leaf first; the leaf's public key
          must be `jwk`), generated with attestationChallenge = UTF-8(nonce), plus a Play Integrity standard-request
          token with requestHash = kid. The service checks the chain to a Google hardware attestation root, the security
          level (StrongBox or TrustedEnvironment gives key_storage strongbox or tee), that the key needs biometric user
          authentication on every use (Class 3), and the verdict for org.openentity.app. MEETS_DEVICE_INTEGRITY is
          required (403 integrity_failed without it); MEETS_STRONG_INTEGRITY is recorded in integrity.strong.
      x-available: day-2
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyAttestationRequest'
      responses:
        '200':
          description: The receipt and its claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyAttestationResponse'
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request'
        '401':
          $ref: '#/components/responses/Error'
          description: 'error: unauthorized, nonce_invalid'
        '403':
          $ref: '#/components/responses/Error'
          description: 'error: attestation_invalid, integrity_failed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/keylog/enrollments:
    post:
      operationId: createEnrollment
      tags: [Key log]
      summary: Offer a new credential to the owner's key log (Add an approver, Add a backup, Replace root)
      description: |
        Called by the device or browser that holds the new credential, signed in to the same account. Its key must
        already exist:
        - a device key (type p256) carries the receipt from POST /v1/keylog/attestations in `attestation.receipt`;
        - a passkey (type webauthn) comes from POST /v1/auth/passkey/options and verify with mode register.

        The service checks the credential (kid is the thumbprint of jwk; the kid is not already in the log; a valid
        receipt for p256) and returns a pending enrollment with a 6-digit `code`, valid 10 minutes. The new device
        shows the code.

        The service pushes {"oe": {"product": "<service DID>", "type": "enrollment.pending", "id": "<enrollment_id>"}}
        to every current approver device. The approver's app reads the enrollment (GET /v1/keylog/enrollments/{id}),
        shows label, platform, attestation, key_storage, integrity, the fingerprint (kid) and the code, and asks the
        owner to confirm that the code matches the new device. Then a key signs the entry that carries `credential`:
        - purpose approver: add_approver {approver: credential}, signed by a current approver, which takes effect at
          once. With no usable approver, the root passkey signs recover {approvers: [credential]} instead, which takes
          effect 24 hours after first sight unless cancelled.
        - purpose root: replace_root {root: credential}, signed by the root passkey or a current approver, which takes
          effect 24 hours after first sight (at once in a single-credential log).

        The signer appends the entry with POST /o/{id}/log {line}. The service matches the entry's credential kid to the
        enrollment, sets its state, and pushes {"type": "enrollment.completed", "id"} to the enrolling install. The new
        device polls GET /v1/keylog/enrollments/{id} every 2 seconds while its screen is open. The entry itself is the
        step-up; no Approval2 is sent.

        At most 3 pending enrollments per account.
      x-available: day-5
      security:
        - ownerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/Error'
          description: 'error: bad_request'
        '401':
          $ref: '#/components/responses/Error'
          description: 'error: unauthorized'
        '403':
          $ref: '#/components/responses/Error'
          description: 'error: key_log_required, attestation_invalid (missing or bad receipt on a p256 credential)'
