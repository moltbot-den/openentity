  /v1/token:
    post:
      operationId: token
      tags: [Tokens and sessions]
      summary: Rotate the refresh token and mint access tokens, or redeem a login code
      description: |
        grant_type `refresh_token`: the refresh token is single use and rotates on every call. A second use of a
        rotated token revokes the whole session (401 token_reused), except an idempotent retry within 30 seconds whose
        successor was never used: that mints a fresh successor. Clients serialize refresh calls and ask for every
        audience they need in one call. Expiry: 90 days sliding (apps), 12 hours absolute (web). Binding: iOS sends
        X-OE-App-Attest; Android sends X-OE-Device-Signature and X-OE-Play-Integrity; the web sends the session cookie
        with Origin equal to the base URL. grant_type `login_code` (or `urn:openentity:login_code`): redeems the
        Android Apple code from /v1/auth/apple/callback; send `client`, and `attestation` on the install's first
        sign-in. Each access token is a 15-minute ES256 JWT with exactly one audience (AccessTokenClaims). Product
        audiences need an owner DID: 403 key_log_required before key log genesis.
